<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Options Lab | Precision Simulator 2026</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --secondary: #94a3b8; 
            --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --input-bg: #334155; --hint: rgba(56, 189, 248, 0.1);
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { background: var(--card); padding: 24px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 600px; border: 1px solid rgba(255,255,255,0.1); }
        .lang-switch { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
        .lang-btn { background: var(--input-bg); border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text); transition: 0.2s; }
        .lang-btn.active { background: var(--primary); color: #000; font-weight: 700; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 15px; }
        label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--secondary); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; background: var(--input-bg); color: white; outline: none; }
        button#calcBtn { width: 100%; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .ad-banner { width: 100%; max-width: 600px; min-height: 90px; margin: 20px 0; background: var(--input-bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--secondary); font-size: 12px; border: 1px dashed rgba(255,255,255,0.1); overflow: hidden; }
        #summary-panel { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .data-card { background: rgba(255,255,255,0.03); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .full-card { grid-column: span 2; }
        .data-label { display: block; font-size: 10px; font-weight: 800; color: var(--secondary); margin-bottom: 6px; text-transform: uppercase; }
        .data-val { font-size: 18px; font-weight: 800; }
        #chart-wrapper { position: relative; margin-top: 20px; background: #000; border-radius: 14px; overflow: hidden; height: 360px; }
        svg { width: 100%; height: 100%; display: block; }
        .tooltip { position: absolute; background: rgba(15, 23, 42, 0.98); padding: 10px; border-radius: 6px; font-size: 11px; color: white; pointer-events: none; display: none; border: 1px solid var(--primary); z-index: 1000; }
        .path-anim { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawLine 1.2s ease-out forwards; }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }
        .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--secondary); font-size: 14px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="ad-banner">ADVERTISEMENT SLOT</div>

<div class="container">
    <div class="lang-switch">
        <button id="lang-en" class="lang-btn active" onclick="setLanguage('en')">English</button>
        <button id="lang-zh" class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>
    <h1 id="ui-title">Pro Options Lab</h1>
    <div class="grid">
        <div style="grid-column: span 2;"><label id="ui-strategy-label">Strategy</label><select id="strategySelect" onchange="updateFields()"></select></div>
        <div><label id="ui-s1">Strike 1</label><input type="number" id="s1" value="95"></div>
        <div id="boxS2"><label id="ui-s2">Strike 2</label><input type="number" id="s2" value="100"></div>
        <div id="boxS3" style="display:none;"><label id="ui-s3">Strike 3</label><input type="number" id="s3" value="110"></div>
        <div id="boxS4" style="display:none;"><label id="ui-s4">Strike 4</label><input type="number" id="s4" value="115"></div>
        <div><label id="ui-premium">Net Prem ($)</label><input type="number" id="premium" value="2.5"></div>
        <div><label id="ui-target">Spot ($)</label><input type="number" id="target" value="105"></div>
    </div>
    <button id="calcBtn" onclick="runCalculation()">ANALYZE STRATEGY</button>
    <div id="summary-panel">
        <div class="data-card"><span class="data-label" id="ui-max-reward-label">Max Reward</span><span id="res-max-profit" class="data-val" style="color:var(--success)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-max-risk-label">Max Risk</span><span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span></div>
        <div class="data-card full-card"><span class="data-label" id="ui-prob-label">Strategy Hint</span><div id="res-prob" style="color:var(--primary); font-weight:700;">--</div></div>
    </div>
    <div id="chart-wrapper">
        <div id="empty-msg" class="empty-state">Click Analyze to view P/L Curve</div>
        <div id="chart-tooltip" class="tooltip"></div>
        <svg id="mainChart" viewBox="0 0 400 360"></svg>
    </div>
</div>

<div class="ad-banner">ADVERTISEMENT SLOT</div>

<script>
    const i18n = {
        en: { title: "Pro Options Lab", strategy: "Strategy", calc: "ANALYZE STRATEGY", s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4", premium: "Net Prem ($)", target: "Spot ($)", maxReward: "Max Reward", maxRisk: "Max Risk", prob: "Strategy Hint", profit: "PROFIT", loss: "LOSS", empty: "Click Analyze to view P/L Curve", price_txt: "Price", opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", straddle: "Straddle", strangle: "Strangle", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" } },
        zh: { title: "專業期權實驗室", strategy: "交易策略", calc: "一鍵分析策略", s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4", premium: "權利金淨額", target: "目前股價", maxReward: "最大獲利", maxRisk: "最大風險", prob: "策略特性提示", profit: "獲利區", loss: "虧損區", empty: "點擊一鍵分析以查看圖表", price_txt: "股價", opt: { long_call: "買入買權", short_call: "賣出買權", long_put: "買入賣權", short_put: "賣出賣權", bull_call: "牛市買權價差", bear_put: "熊市賣權價差", straddle: "跨式組合", strangle: "勒式組合", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" } }
    };

    let currentLang = 'en';

    function setLanguage(lang) {
        currentLang = lang;
        const d = i18n[lang];
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === `lang-${lang}`));
        document.getElementById('ui-title').innerText = d.title;
        document.getElementById('ui-strategy-label').innerText = d.strategy;
        document.getElementById('calcBtn').innerText = d.calc;
        document.getElementById('empty-msg').innerText = d.empty;
        const select = document.getElementById('strategySelect');
        const cur = select.value || 'iron_condor';
        select.innerHTML = Object.entries(d.opt).map(([k,v]) => `<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join('');
        updateFields();
    }

    function updateFields() {
        const s = document.getElementById('strategySelect').value;
        const isSingle = ['long_call','short_call','long_put','short_put'].includes(s);
        document.getElementById('boxS2').style.display = isSingle ? 'none' : 'block';
        document.getElementById('boxS3').style.display = ['butterfly','iron_condor'].includes(s) ? 'block' : 'none';
        document.getElementById('boxS4').style.display = (s === 'iron_condor') ? 'block' : 'none';
    }

    function getP(p, s, v1, v2, v3, v4, prem) {
        switch(s) {
            case 'long_call': return Math.max(0, p - v1) - prem;
            case 'short_call': return prem - Math.max(0, p - v1);
            case 'long_put': return Math.max(0, v1 - p) - prem;
            case 'short_put': return prem - Math.max(0, v1 - p);
            case 'bull_call': return (Math.max(0, p - v1) - Math.max(0, p - v2)) - prem;
            case 'bear_put': return (Math.max(0, v2 - p) - Math.max(0, v1 - p)) - prem;
            case 'straddle': return (Math.max(0, p - v1) + Math.max(0, v1 - p)) - prem;
            case 'strangle': return (Math.max(0, v1 - p) + Math.max(0, p - v2)) - prem;
            case 'butterfly': return (Math.max(0, p - v1) - 2 * Math.max(0, p - v2) + Math.max(0, p - v3)) - prem;
            case 'iron_condor': return prem - (Math.max(0, v2 - p) - Math.max(0, v1 - p)) - (Math.max(0, p - v3) - Math.max(0, p - v4));
            default: return 0;
        }
    }

    function runCalculation() {
        document.getElementById('empty-msg').style.display = 'none';
        const sSelect = document.getElementById('strategySelect').value;
        const v1 = parseFloat(document.getElementById('s1').value), v2 = parseFloat(document.getElementById('s2').value);
        const v3 = parseFloat(document.getElementById('s3').value), v4 = parseFloat(document.getElementById('s4').value);
        const prem = parseFloat(document.getElementById('premium').value), S = parseFloat(document.getElementById('target').value);
        
        const xMin = S * 0.7, xMax = S * 1.3;
        let data = [];
        let bePoints = [];
        for(let i=0; i<=200; i++) {
            let p = xMin + (i * (xMax - xMin) / 200);
            let y = getP(p, sSelect, v1, v2, v3, v4, prem);
            data.push({x: p, y: y});
            if(i > 0 && ((data[i-1].y < 0 && y >= 0) || (data[i-1].y > 0 && y <= 0))) bePoints.push(p);
        }
        
        // Update Summary (Simplified)
        document.getElementById('res-max-profit').innerText = "Check Chart";
        document.getElementById('res-max-loss').innerText = "Check Chart";
        document.getElementById('res-prob').innerText = "Strategy Visualized";

        drawSVG(data, xMin, xMax, S, bePoints);
    }

    function drawSVG(data, xMin, xMax, S, bePoints) {
        const svg = document.getElementById('mainChart'), W = 400, H = 360, MID = H/2;
        const getX = (x) => ((x - xMin) / (xMax - xMin)) * W;
        const maxY = Math.max(...data.map(d => Math.abs(d.y))) * 1.5 || 1;
        const getY = (y) => MID - (y / maxY) * (H * 0.4);

        const centerIdx = data.findIndex(d => d.x >= S);
        const leftData = data.slice(0, centerIdx + 1).reverse();
        const rightData = data.slice(centerIdx);

        const fullPathD = `M ${getX(data[0].x)} ${getY(data[0].y)} ` + data.map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
        const fillD = fullPathD + ` L ${getX(data[data.length-1].x)} ${MID} L ${getX(data[0].x)} ${MID} Z`;

        svg.innerHTML = `
            <defs>
                <clipPath id="up"><rect x="0" y="0" width="${W}" height="${MID}" /></clipPath>
                <clipPath id="down"><rect x="0" y="${MID}" width="${W}" height="${MID}" /></clipPath>
            </defs>
            <path d="${fillD}" fill="#22c55e" opacity="0.2" clip-path="url(#up)" />
            <path d="${fillD}" fill="#ef4444" opacity="0.2" clip-path="url(#down)" />
            <line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="#475569" stroke-width="1.5" />
            <path d="${makePath(leftData, getX, getY)}" fill="none" stroke="#38bdf8" stroke-width="3" class="path-anim" />
            <path d="${makePath(rightData, getX, getY)}" fill="none" stroke="#38bdf8" stroke-width="3" class="path-anim" />
            ${bePoints.map(be => `<line x1="${getX(be)}" y1="${MID-10}" x2="${getX(be)}" y2="${MID+10}" stroke="#fbbf24" stroke-width="2" />`).join('')}
            <line id="v-line" y1="0" y2="${H}" stroke="white" stroke-dasharray="4" style="display:none" />
        `;

        const vLine = svg.getElementById('v-line'), tooltip = document.getElementById('chart-tooltip');
        svg.onmousemove = (e) => {
            const rect = svg.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (W / rect.width);
            const item = data.reduce((prev, curr) => Math.abs(getX(curr.x) - mouseX) < Math.abs(getX(prev.x) - mouseX) ? curr : prev);
            vLine.setAttribute('x1', getX(item.x)); vLine.setAttribute('x2', getX(item.x)); vLine.style.display = 'block';
            tooltip.style.display = 'block';
            let tx = e.clientX - rect.left + 15; if (tx + 120 > rect.width) tx -= 140;
            tooltip.style.left = tx + 'px'; tooltip.style.top = (e.clientY - rect.top - 50) + 'px';
            tooltip.innerHTML = `Price: $${item.x.toFixed(1)}<br><b>P/L: $${(item.y * 100).toFixed(0)}</b>`;
        };
        svg.onmouseleave = () => { vLine.style.display = tooltip.style.display = 'none'; };
    }

    function makePath(arr, getX, getY) {
        if(!arr.length) return "";
        return `M ${getX(arr[0].x)} ${getY(arr[0].y)} ` + arr.map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
    }

    window.onload = () => setLanguage('en');
</script>
</body>
</html>
