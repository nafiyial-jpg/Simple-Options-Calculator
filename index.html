<html lang="en">
<head>

    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --secondary: #94a3b8; 
            --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --input-bg: #334155;
            --buy: #38bdf8; --sell: #fb7185; --share-bg: #6366f1; 
        }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--card); padding: 35px; border-radius: 28px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); width: 100%; max-width: 1000px; border: 1px solid rgba(255,255,255,0.1); }
        
        .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 20px; }
        .lang-btn { background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--secondary); transition: 0.3s; font-weight: 600; }
        .lang-btn.active { background: var(--primary) !important; color: #000 !important; border-color: var(--primary); }
        .share-btn { background: var(--share-bg); color: white; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: 0.2s; }

        /* 廣告容器樣式 (SEO 最優化：預留高度避免 CLS) */
        .ad-slot { margin: 20px 0; background: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.1); border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 90px; color: var(--secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

        h1#ui-title { font-size: 2.2rem; margin: 0 0 20px 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 15px; align-items: flex-end; }
        .full-width { grid-column: 1 / -1; }
        .field-group { display: flex; flex-direction: column; width: 100%; }
        .extra-strike { display: none; } 
        label { display: flex; align-items: center; min-height: 22px; font-size: 11px; font-weight: 800; margin-bottom: 10px; color: var(--secondary); text-transform: uppercase; }
        .op-tag { font-size: 9px; padding: 2px 8px; border-radius: 6px; margin-left: auto; font-weight: 900; }
        .tag-buy { background: rgba(56, 189, 248, 0.15); color: var(--buy); border: 1px solid var(--buy); }
        .tag-sell { background: rgba(251, 113, 133, 0.15); color: var(--sell); border: 1px solid var(--sell); }

        input, select { width: 100%; height: 50px; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; font-size: 15px; background: var(--input-bg); color: white; outline: none; }
        button#calcBtn { width: 100%; padding: 20px; background: var(--primary); color: #000; border: none; border-radius: 18px; font-size: 18px; font-weight: 900; cursor: pointer; margin-top: 30px; transition: 0.2s; }
        button#calcBtn:disabled { opacity: 0.3; cursor: not-allowed; }

        #summary-panel { margin-top: 25px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .data-card { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .data-label { display: block; font-size: 10px; font-weight: 800; color: var(--secondary); margin-bottom: 8px; text-transform: uppercase; }
        .data-val { font-size: 22px; font-weight: 900; }

        #chart-wrapper { position: relative; margin-top: 30px; background: #000; border-radius: 24px; height: 400px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
        .tooltip { position: absolute; background: rgba(15, 23, 42, 0.95); padding: 12px; border-radius: 10px; font-size: 12px; color: white; pointer-events: none; border: 1px solid var(--primary); z-index: 1000; display: none; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        
        .seo-content { max-width: 1000px; margin-top: 50px; color: var(--secondary); line-height: 1.8; font-size: 0.95rem; }
        .seo-content h2 { color: var(--text); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .seo-content h4 { color: var(--primary); margin-top: 20px; }
        .disclaimer { font-size: 0.8rem; margin-top: 40px; border-top: 1px solid #334155; padding-top: 15px; opacity: 0.6; }
    </style>
</head>
<body>
<main class="container">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <span id="ui-share">Copy Link</span>
        </button>

    </div>
    
    <h1 id="ui-title">Pro Options Lab</h1>

    <!-- 上方廣告位 (SEO: Top Placement for High CTR) -->
    <div class="ad-slot">
        <!-- 這裡放入 Google AdSense 代碼 -->
        Advertisement - Responsive Ad Slot
    </div>

    <div class="grid">
        <div class="full-width field-group"><label id="ui-strategy">Strategy</label><select id="strategySelect" onchange="handleStrategyChange()"></select></div>
        <div class="field-group"><label><span id="ui-s1">Strike 1</span><span id="tag-s1" class="op-tag"></span></label><input type="number" id="s1" value="95" oninput="handleInputChange()"></div>
        <div id="boxS2" class="field-group extra-strike"><label><span id="ui-s2">Strike 2</span><span id="tag-s2" class="op-tag"></span></label><input type="number" id="s2" value="100" oninput="handleInputChange()"></div>
        <div id="boxS3" class="field-group extra-strike"><label><span id="ui-s3">Strike 3</span><span id="tag-s3" class="op-tag"></span></label><input type="number" id="s3" value="110" oninput="handleInputChange()"></div>
        <div id="boxS4" class="field-group extra-strike"><label><span id="ui-s4">Strike 4</span><span id="tag-s4" class="op-tag"></span></label><input type="number" id="s4" value="115" oninput="handleInputChange()"></div>
        <div class="field-group"><label id="ui-premium">Net Prem ($)</label><input type="number" id="premium" step="0.1" value="2.0" oninput="handleInputChange()"></div>
        <div class="field-group"><label id="ui-target">Spot Price ($)</label><input type="number" id="target" value="105" oninput="handleInputChange()"></div>
    </div>

    <button id="calcBtn" onclick="runCalculation()">ANALYZE STRATEGY</button>

    <div id="summary-panel">
        <div class="data-card"><span class="data-label" id="ui-maxReward">Max Profit</span><span id="res-max-profit" class="data-val" style="color:var(--success)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-maxRisk">Max Risk</span><span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-probHint">Logic Hint</span><span id="res-prob" class="data-val" style="color:var(--primary); font-size:12px;">--</span></div>
    </div>

    <!-- 中間廣告位 (SEO: Near results for high engagement) -->
    <div class="ad-slot" style="min-height: 250px;">
        <!-- 這裡適合放置橫幅或正方形廣告 -->
        Advertisement - P/L Analysis Companion
    </div>

    <div id="chart-wrapper">
        <div id="chart-tooltip" class="tooltip"></div>
        <svg id="mainChart" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <article id="seo-article" class="seo-content"></article>
</main>

<script>
const i18n = {
    en: {
        title: "Pro Options Lab", strategy: "Strategy", s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4", premium: "Net Prem ($)", target: "Spot ($)", maxReward: "Max Profit", maxRisk: "Max Risk", probHint: "Logic Hint", calc: "ANALYZE STRATEGY", price: "PRICE", pl: "EST. P/L", bep: "BEP", buy: "BUY", sell: "SELL", low: "Low", mid: "Mid", high: "High", call: "CALL", put: "PUT", unlimited: "Unlimited", share: "Copy Link", copied: "Copied!",
        opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" },
        hints: { ready: "Ready to Analyze", err: "Logic Error (Price Order)!", bull: "Bullish Strategy", bear: "Bearish Strategy", neut: "Neutral Strategy" },
        seo: `<h2>Mastering Options Trading with Visual P/L Analysis</h2><p>Using an <strong>Options Profit Calculator</strong> is the most effective way to manage risk. Pro Options Lab simplifies complex derivatives into interactive graphs.</p><h3>Popular Strategies Explained</h3><h4>1. Iron Condor</h4><p>The <strong>Iron Condor</strong> is a neutral strategy designed to profit from low volatility. It involves selling a bear call spread and a bull put spread simultaneously.</p><h4>2. Butterfly Spread</h4><p>A <strong>Butterfly Spread</strong> is a limited-risk strategy. Peak profit occurs when the underlying stock price equals the middle strike at expiry.</p><h4>3. Vertical Spreads (Bull/Bear)</h4><p>Define your absolute Maximum Risk and Reward by visualizing the offset between premiums. These spreads limit your downside while defining clear profit targets.</p><h3>Why Use a P/L Graph?</h3><ul><li><strong>Risk Management:</strong> Know your max loss before you trade.</li><li><strong>Break-Even Points:</strong> Identify the precise price points for profitability.</li></ul>`
    },
    zh: {
        title: "專業期權分析實驗室", strategy: "交易策略", s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4", premium: "權利金淨額", target: "標的價格", maxReward: "最大獲利", maxRisk: "最大風險", probHint: "邏輯提示", calc: "一鍵分析策略損益", price: "標的價格", pl: "預計損益", bep: "損益點", buy: "買入", sell: "賣出", low: "低", mid: "中", high: "高", call: "買權", put: "賣權", unlimited: "無限制", share: "複製分享連結", copied: "已複製！",
        opt: { long_call: "買入買權 (Long Call)", short_call: "賣出買權 (Short Call)", long_put: "買入賣權 (Long Put)", short_put: "賣出賣權 (Short Put)", bull_call: "牛市買權價差", bear_put: "熊市賣權價差", butterfly: "蝴蝶價差策略", iron_condor: "鐵鷹策略" },
        hints: { ready: "設定正確，請點擊分析", err: "順序錯誤 (需由小到大)！", bull: "看多策略", bear: "看空策略", neut: "中性策略" },
        seo: `<h2>透過視覺化損益圖表掌握期權交易</h2><p>在進入交易前，使用<strong>期權損益計算機</strong>是管理風險最有效的方式。Pro Options Lab 將複雜的衍生性商品轉化為損益圖表。</p><h3>熱門交易策略解析</h3><h4>1. 鐵鷹策略 (Iron Condor)</h4><p><strong>鐵鷹策略</strong>是一種旨在從低波動中獲利的中性策略。目標是讓股價維持在區間內。</p><h4>2. 蝴蝶價差 (Butterfly Spread)</h4><p><strong>蝴蝶價差</strong>是一種風險有限的中性策略。當標的資產在到期時的價格等於中間履約價時，獲利最大。</p><h4>3. 垂直價差 (Vertical Spreads - 牛市/熊市價差)</h4><p>透過視覺化買入與賣出期權之間的權利金差額，鎖定明確的獲利與風險目標。</p><h3>為什麼要使用損益 (P/L) 分析圖？</h3><ul><li><strong>風險管理：</strong>在投入資金前，精確掌握您的最大潛在虧損。</li><li><strong>損益平衡點分析：</strong>識別開始獲利所需的確切股價邊界 (BEP)。</li></ul>`
    }
};

let currentLang = 'en', isCalculated = false, globalData = [];

function setLanguage(lang) {
    currentLang = lang;
    const d = i18n[lang];
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+lang).classList.add('active');
    ['strategy','s1','s2','s3','s4','premium','target','maxReward','maxRisk','probHint'].forEach(id => {
        const el = document.getElementById('ui-'+id); if(el) el.innerText = d[id];
    });
    document.getElementById('calcBtn').innerText = d.calc;
    document.getElementById('ui-share').innerText = d.share;
    document.getElementById('seo-article').innerHTML = d.seo;
    document.getElementById('tab-title').innerText = d.title;
    const select = document.getElementById('strategySelect');
    const curVal = select.value || 'long_call';
    select.innerHTML = Object.entries(d.opt).map(([k,v]) => `<option value="${k}" ${k===curVal?'selected':''}>${v}</option>`).join('');
    updateTags(); validateLogic(); if(isCalculated) runCalculation();
}

function resetResults() {
    isCalculated = false;
    document.getElementById('res-max-profit').innerText = "--";
    document.getElementById('res-max-loss').innerText = "--";
    document.getElementById('mainChart').innerHTML = "";
    document.getElementById('chart-tooltip').style.display = 'none';
}

function handleStrategyChange() { 
    resetResults(); 
    updateFields(); 
    updateTags(); 
    validateLogic(); 
}

function handleInputChange() { 
    resetResults(); 
    validateLogic(); 
}

function updateFields() {
    const s = document.getElementById('strategySelect').value;
    ['boxS2','boxS3','boxS4'].forEach(id => document.getElementById(id).style.display = 'none');
    if(!['long_call','short_call','long_put','short_put'].includes(s)) document.getElementById('boxS2').style.display = 'flex';
    if(['butterfly','iron_condor'].includes(s)) document.getElementById('boxS3').style.display = 'flex';
    if(s==='iron_condor') document.getElementById('boxS4').style.display = 'flex';
}

function updateTags() {
    const s = document.getElementById('strategySelect').value, d = i18n[currentLang];
    const setTag = (id, act, typ, pos) => {
        const el = document.getElementById('tag-'+id);
        el.innerText = `${d[act]} ${d[typ]} (${d[pos]})`;
        el.className = `op-tag tag-${act}`;
    };
    switch(s) {
        case 'long_call': setTag('s1','buy','call','low'); break;
        case 'short_call': setTag('s1','sell','call','low'); break;
        case 'long_put': setTag('s1','buy','put','low'); break;
        case 'short_put': setTag('s1','sell','put','low'); break;
        case 'bull_call': setTag('s1','buy','call','low'); setTag('s2','sell','call','high'); break;
        case 'bear_put': setTag('s1','sell','put','low'); setTag('s2','buy','put','high'); break;
        case 'butterfly': setTag('s1','buy','call','low'); setTag('s2','sell','call','mid'); setTag('s3','buy','call','high'); break;
        case 'iron_condor': setTag('s1','buy','put','low'); setTag('s2','sell','put','mid'); setTag('s3','sell','call','mid'); setTag('s4','buy','call','high'); break;
    }
}

function validateLogic() {
    const s = document.getElementById('strategySelect').value, v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value)||0);
    const btn = document.getElementById('calcBtn'), hint = document.getElementById('res-prob'), d = i18n[currentLang];
    let valid = true;
    if(['bull_call','bear_put'].includes(s) && v[0]>=v[1]) valid = false;
    else if(s==='butterfly' && (v[0]>=v[1] || v[1]>=v[2])) valid = false;
    else if(s==='iron_condor' && (v[0]>=v[1] || v[1]>=v[2] || v[2]>=v[3])) valid = false;
    btn.disabled = !valid;
    hint.innerText = valid ? (isCalculated ? hint.innerText : d.hints.ready) : d.hints.err;
    hint.style.color = valid ? 'var(--primary)' : 'var(--danger)';
    return valid;
}

function getP(p, s, v, prem) {
    switch(s) {
        case 'long_call': return Math.max(0, p-v[0])-prem;
        case 'short_call': return prem-Math.max(0, p-v[0]);
        case 'long_put': return Math.max(0, v[0]-p)-prem;
        case 'short_put': return prem-Math.max(0, v[0]-p);
        case 'bull_call': return (Math.max(0, p-v[0])-Math.max(0, p-v[1]))-prem;
        case 'bear_put': return (Math.max(0, v[1]-p)-Math.max(0, v[0]-p))-prem;
        case 'butterfly': return (Math.max(0, p-v[0])-2*Math.max(0, p-v[1])+Math.max(0, p-v[2]))-prem;
        case 'iron_condor': return prem - (Math.max(0, v[1]-p)-Math.max(0, v[0]-p) + Math.max(0, p-v[2])-Math.max(0, p-v[3]));
        default: return 0;
    }
}

function runCalculation() {
    if(!validateLogic()) return; isCalculated = true;
    const s = document.getElementById('strategySelect').value, v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value)||0), prem = parseFloat(document.getElementById('premium').value)||0, S = parseFloat(document.getElementById('target').value)||0, d = i18n[currentLang];
    let mP = 0, mL = 0, h = d.hints.neut;
    if(['long_call','bull_call'].includes(s)) h = d.hints.bull; else if(['long_put','bear_put'].includes(s)) h = d.hints.bear;
    switch(s) {
        case 'long_call': case 'long_put': mP = d.unlimited; mL = prem*100; break;
        case 'short_call': case 'short_put': mP = prem*100; mL = d.unlimited; break;
        case 'bull_call': case 'bear_put': mP = (Math.abs(v[1]-v[0])-prem)*100; mL = prem*100; break;
        case 'butterfly': mP = (v[1]-v[0]-prem)*100; mL = prem*100; break;
        case 'iron_condor': mP = prem*100; mL = (Math.max(v[1]-v[0], v[3]-v[2])-prem)*100; break;
    }
    document.getElementById('res-max-profit').innerText = (typeof mP === 'number') ? `$${mP.toFixed(0)}` : mP;
    document.getElementById('res-max-loss').innerText = (typeof mL === 'number') ? `$${mL.toFixed(0)}` : mL;
    document.getElementById('res-prob').innerText = h;
    let range = Math.max(Math.abs(S-v[0]), 50) * 1.6, xMin = Math.max(0, S-range), xMax = S+range;
    globalData = []; let beps = [];
    for(let i=0; i<=200; i++) {
        let p = xMin + (i * (xMax-xMin)/200), y = getP(p, s, v, prem);
        globalData.push({x: p, y: y});
        if (i > 0 && ((globalData[i-1].y < 0 && y >= 0) || (globalData[i-1].y > 0 && y <= 0))) beps.push({x: p});
    }
    drawSVG(globalData, xMin, xMax, S, beps);
}

function drawSVG(data, xMin, xMax, spot, beps) {
    const svg = document.getElementById('mainChart'), W = 800, H = 400, MID = H/2, d = i18n[currentLang];
    const maxY = Math.max(...data.map(p => Math.abs(p.y)), 1) * 1.2;
    const getX = (x) => ((x-xMin)/(xMax-xMin))*W, getY = (y) => MID-(y/maxY)*(MID*0.8);
    const pathD = `M ${getX(data[0].x)} ${getY(data[0].y)} ` + data.slice(1).map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
    const fillD = `${pathD} L ${getX(data[data.length-1].x)} ${MID} L ${getX(data[0].x)} ${MID} Z`;
    
    svg.innerHTML = `<defs><clipPath id="u"><rect x="0" y="0" width="800" height="${MID}"/></clipPath><clipPath id="dn"><rect x="0" y="${MID}" width="800" height="${MID}"/></clipPath></defs>
        <path d="${fillD}" fill="var(--success)" opacity="0.15" clip-path="url(#u)"/><path d="${fillD}" fill="var(--danger)" opacity="0.15" clip-path="url(#dn)"/>
        <line x1="0" y1="${MID}" x2="800" y2="${MID}" stroke="#475569" stroke-width="1"/><path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="3"/>
        <line x1="${getX(spot)}" y1="0" x2="${getX(spot)}" y2="${H}" stroke="white" stroke-dasharray="5" opacity="0.4"/>
        ${beps.map(b => `<circle cx="${getX(b.x)}" cy="${MID}" r="5" fill="#fbbf24"/><text x="${getX(b.x)}" y="${MID-12}" fill="#fbbf24" font-size="10" text-anchor="middle" font-weight="700">${d.bep} ${b.x.toFixed(1)}</text>`).join('')}`;

    svg.onmousemove = (e) => {
        if(!isCalculated) return;
        const rect = svg.getBoundingClientRect(), tt = document.getElementById('chart-tooltip');
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const item = globalData.reduce((a, b) => Math.abs(getX(b.x) - mx) < Math.abs(getX(a.x) - mx) ? b : a);
        tt.style.display = 'block';
        let posX = e.clientX - rect.left + 20, ttW = 160;
        if (posX + ttW > rect.width) posX = e.clientX - rect.left - ttW - 20;
        tt.style.left = posX + 'px'; tt.style.top = (e.clientY - rect.top - 65) + 'px';
        tt.innerHTML = `${d.price}: $${item.x.toFixed(2)}<br>${d.pl}: <span style="color:${item.y>=0?'var(--success)':'var(--danger)'}; font-weight:900">$${(item.y*100).toFixed(0)}</span>`;
    };
    svg.onmouseleave = () => document.getElementById('chart-tooltip').style.display='none';
}

function copyShareLink() { 
    const p = new URLSearchParams(); p.set('lang', currentLang); p.set('s', document.getElementById('strategySelect').value);
    ['s1','s2','s3','s4','premium','target'].forEach(id => p.set(id, document.getElementById(id).value));
    navigator.clipboard.writeText(window.location.origin + window.location.pathname + '?' + p.toString());
    const btn = document.querySelector('#shareBtn span'); btn.innerText = i18n[currentLang].copied; setTimeout(()=>btn.innerText=i18n[currentLang].share, 2000);
}

window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if(params.has('lang')) currentLang = params.get('lang');
    setLanguage(currentLang);
    if(params.has('s')) {
        document.getElementById('strategySelect').value = params.get('s');
        ['s1','s2','s3','s4','premium','target'].forEach(id => { if(params.has(id)) document.getElementById(id).value = params.get(id); });
        updateFields(); updateTags(); runCalculation();
    } else { updateFields(); }
};
</script>
