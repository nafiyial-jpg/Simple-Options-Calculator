<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Options Lab | Infinite Workspace</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --secondary: #94a3b8; 
            --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --input-bg: #334155;
            --buy: #38bdf8; --sell: #fb7185;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { background: var(--card); padding: 30px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); width: 100%; max-width: 1000px; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; }
        .lang-btn { background: var(--input-bg); border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--text); transition: 0.3s; }
        .lang-btn.active { background: var(--primary) !important; color: #000 !important; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .full-width { grid-column: span 2; }
        label { display: flex; align-items: center; font-size: 11px; font-weight: 800; margin-bottom: 8px; color: var(--secondary); text-transform: uppercase; }
        .op-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: 900; letter-spacing: 0.5px; }
        .tag-buy { background: rgba(56, 189, 248, 0.15); color: var(--buy); border: 1px solid var(--buy); }
        .tag-sell { background: rgba(251, 113, 133, 0.15); color: var(--sell); border: 1px solid var(--sell); }
        input, select { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 15px; background: var(--input-bg); color: white; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); background: #3d4d63; }
        button#calcBtn { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        button#calcBtn:disabled { opacity: 0.3; cursor: not-allowed; }
        #summary-panel { margin-top: 25px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .data-card { background: rgba(255,255,255,0.02); padding: 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .data-label { display: block; font-size: 10px; font-weight: 800; color: var(--secondary); margin-bottom: 6px; text-transform: uppercase; }
        .data-val { font-size: 18px; font-weight: 800; }
        #chart-wrapper { position: relative; margin-top: 25px; background: #000; border-radius: 20px; height: 380px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        svg { width: 100%; height: 100%; display: block; }
        .tooltip { position: absolute; background: rgba(15, 23, 42, 0.95); padding: 12px; border-radius: 8px; font-size: 12px; color: white; pointer-events: none; display: none; border: 1px solid var(--primary); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 140px; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
        <button id="btn-zh" class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>
    <h1 id="ui-title" style="margin:0; font-size:28px;">Pro Options Lab</h1>
    <div class="grid">
        <div class="full-width"><label id="ui-strategy">Strategy</label><select id="strategySelect" onchange="handleStrategyChange()"></select></div>
        <div><label><span id="ui-s1">Strike 1</span><span id="tag-s1" class="op-tag"></span></label><input type="number" id="s1" value="100" oninput="handleInputChange()"></div>
        <div id="boxS2"><label><span id="ui-s2">Strike 2</span><span id="tag-s2" class="op-tag"></span></label><input type="number" id="s2" value="110" oninput="handleInputChange()"></div>
        <div id="boxS3" style="display:none;"><label><span id="ui-s3">Strike 3</span><span id="tag-s3" class="op-tag"></span></label><input type="number" id="s3" value="120" oninput="handleInputChange()"></div>
        <div id="boxS4" style="display:none;"><label><span id="ui-s4">Strike 4</span><span id="tag-s4" class="op-tag"></span></label><input type="number" id="s4" value="130" oninput="handleInputChange()"></div>
        <div><label id="ui-premium">Net Prem ($)</label><input type="number" id="premium" step="0.1" value="3.5" oninput="handleInputChange()"></div>
        <div><label id="ui-target">Spot ($)</label><input type="number" id="target" value="105" oninput="handleInputChange()"></div>
    </div>
    <button id="calcBtn" onclick="runCalculation()">ANALYZE STRATEGY</button>
    <div id="summary-panel">
        <div class="data-card"><span class="data-label" id="ui-maxReward">Max Profit</span><span id="res-max-profit" class="data-val" style="color:var(--success)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-maxRisk">Max Risk</span><span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span></div>
        <div class="data-card" id="hint-card"><span class="data-label" id="ui-probHint">Logic Hint</span><span id="res-prob" class="data-val" style="color:var(--primary); font-size:12px;">--</span></div>
    </div>
    <div id="chart-wrapper"><div id="chart-tooltip" class="tooltip"></div><svg id="mainChart" viewBox="0 0 800 380" preserveAspectRatio="none"></svg></div>
</div>

<script>
    const i18n = {
        en: { title: "Pro Options Lab", strategy: "Strategy", s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4", premium: "Net Prem ($)", target: "Spot ($)", maxReward: "Max Profit", maxRisk: "Max Risk", probHint: "Logic Hint", calc: "ANALYZE STRATEGY", bep: "BEP", unlimited: "Unlimited", buy: "BUY", sell: "SELL", low: "Low", mid: "Mid", high: "High", opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" }, hints: { ready: "Ready to Analyze", err: "Logic Error!" } },
        zh: { title: "專業期權實驗室", strategy: "交易策略", s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4", premium: "權利金淨額", target: "目前股價", maxReward: "最大獲利", maxRisk: "最大風險", probHint: "邏輯提示", calc: "一鍵分析策略", bep: "損益點", unlimited: "理論無限", buy: "買入", sell: "賣出", low: "低", mid: "中", high: "高", opt: { long_call: "買入買權", short_call: "賣出買權", long_put: "買入賣權", short_put: "賣出賣權", bull_call: "牛市買權價差", bear_put: "熊市賣權價差", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" }, hints: { ready: "設定正確，請分析", err: "順序錯誤！" } }
    };

    let currentLang = 'en';

    function updateTags() {
        const s = document.getElementById('strategySelect').value;
        const d = i18n[currentLang];
        const ids = ['s1', 's2', 's3', 's4'];
        ids.forEach(id => {
            const el = document.getElementById('tag-' + id);
            el.innerText = ''; el.className = 'op-tag';
        });
        const setTag = (id, type, pos) => {
            const el = document.getElementById('tag-' + id);
            el.innerText = `${d[type]} (${d[pos]})`;
            el.className = `op-tag tag-${type}`;
        };
        switch(s) {
            case 'long_call': case 'long_put': setTag('s1', 'buy', 'low'); break;
            case 'short_call': case 'short_put': setTag('s1', 'sell', 'low'); break;
            case 'bull_call': setTag('s1', 'buy', 'low'); setTag('s2', 'sell', 'high'); break;
            case 'bear_put': setTag('s1', 'sell', 'low'); setTag('s2', 'buy', 'high'); break;
            case 'butterfly': setTag('s1', 'buy', 'low'); setTag('s2', 'sell', 'mid'); setTag('s3', 'buy', 'high'); break;
            case 'iron_condor': setTag('s1', 'buy', 'low'); setTag('s2', 'sell', 'mid'); setTag('s3', 'sell', 'mid'); setTag('s4', 'buy', 'high'); break;
        }
    }

    function validateLogic() {
        const s = document.getElementById('strategySelect').value;
        const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value) || 0);
        const btn = document.getElementById('calcBtn'), hint = document.getElementById('res-prob'), d = i18n[currentLang];
        let valid = true;
        if (['bull_call', 'bear_put'].includes(s) && v[0] >= v[1]) valid = false;
        else if (s === 'butterfly' && (v[0] >= v[1] || v[1] >= v[2])) valid = false;
        else if (s === 'iron_condor' && (v[0] >= v[1] || v[1] >= v[2] || v[2] >= v[3])) valid = false;
        btn.disabled = !valid;
        hint.innerText = valid ? d.hints.ready : d.hints.err;
        hint.style.color = valid ? 'var(--primary)' : 'var(--danger)';
        return valid;
    }

    function handleStrategyChange() { updateFields(); updateTags(); resetOutput(); }
    function handleInputChange() { validateLogic(); resetOutput(); }
    function resetOutput() { 
        document.getElementById('res-max-profit').innerText = '--';
        document.getElementById('res-max-loss').innerText = '--';
        document.getElementById('mainChart').innerHTML = '';
    }

    function setLanguage(lang) {
        currentLang = lang;
        const d = i18n[lang];
        document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
        document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
        ['title','strategy','s1','s2','s3','s4','premium','target','maxReward','maxRisk','probHint'].forEach(id => {
            if(document.getElementById('ui-'+id)) document.getElementById('ui-'+id).innerText = d[id];
        });
        document.getElementById('calcBtn').innerText = d.calc;
        const select = document.getElementById('strategySelect');
        const cur = select.value || 'long_call';
        select.innerHTML = Object.entries(d.opt).map(([k,v]) => `<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join('');
        updateTags(); validateLogic();
        if(document.getElementById('res-max-profit').innerText !== '--') runCalculation();
    }

    function updateFields() {
        const s = document.getElementById('strategySelect').value;
        ['boxS2','boxS3','boxS4'].forEach(id => document.getElementById(id).style.display = 'none');
        if(!['long_call','short_call','long_put','short_put'].includes(s)) document.getElementById('boxS2').style.display = 'block';
        if(['butterfly','iron_condor'].includes(s)) document.getElementById('boxS3').style.display = 'block';
        if(s === 'iron_condor') document.getElementById('boxS4').style.display = 'block';
    }

    function getP(p, s, v, prem) {
        switch(s) {
            case 'long_call': return Math.max(0, p - v[0]) - prem;
            case 'short_call': return prem - Math.max(0, p - v[0]);
            case 'long_put': return Math.max(0, v[0] - p) - prem;
            case 'short_put': return prem - Math.max(0, v[0] - p);
            case 'bull_call': return (Math.max(0, p - v[0]) - Math.max(0, p - v[1])) - prem;
            case 'bear_put': return (Math.max(0, v[1] - p) - Math.max(0, v[0] - p)) - prem;
            case 'butterfly': return (Math.max(0, p - v[0]) - 2 * Math.max(0, p - v[1]) + Math.max(0, p - v[2])) - prem;
            case 'iron_condor': return prem - Math.max(0, v[0] - p) - Math.max(0, p - v[3]);
            default: return 0;
        }
    }

    function runCalculation() {
        const s = document.getElementById('strategySelect').value;
        const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value) || 0);
        const prem = parseFloat(document.getElementById('premium').value) || 0, S = parseFloat(document.getElementById('target').value) || 0, dL = i18n[currentLang];
        let mP = 0, mL = 0;
        switch(s) {
            case 'long_call': case 'long_put': mP = dL.unlimited; mL = prem * 100; break;
            case 'short_call': case 'short_put': mP = prem * 100; mL = dL.unlimited; break;
            case 'bull_call': case 'bear_put': mP = (Math.abs(v[1]-v[0])-prem)*100; mL = prem*100; break;
            case 'butterfly': mP = (v[1]-v[0]-prem)*100; mL = prem*100; break;
            case 'iron_condor': mP = prem*100; mL = (v[1]-v[0]-prem)*100; break;
        }
        document.getElementById('res-max-profit').innerText = typeof mP === 'number' ? `$${mP.toFixed(0)}` : mP;
        document.getElementById('res-max-loss').innerText = typeof mL === 'number' ? `$${mL.toFixed(0)}` : mL;

        let center = v[0];
        if(s==='butterfly') center = v[1]; else if(s==='iron_condor') center = (v[1]+v[2])/2; else if(['bull_call','bear_put'].includes(s)) center = (v[0]+v[1])/2;
        const range = Math.max(Math.abs(center-v[0]), Math.abs(center-S), 50) * 1.6;
        const xMin = center - range, xMax = center + range;
        let data = [], beps = [];
        for(let i=0; i<=250; i++) {
            let p = xMin + (i * (xMax - xMin) / 250);
            let y = getP(p, s, v, prem);
            data.push({x: p, y: y});
            if (i > 0 && ((data[i-1].y < 0 && y >= 0) || (data[i-1].y > 0 && y <= 0))) beps.push({x: p});
        }
        drawSVG(data, xMin, xMax, S, beps);
    }

    function drawSVG(data, xMin, xMax, spot, beps) {
        const svg = document.getElementById('mainChart'), W = 800, H = 380, MID = H/2, d = i18n[currentLang];
        const getX = (x) => ((x - xMin) / (xMax - xMin)) * W;
        const maxY = Math.max(...data.map(p => Math.abs(p.y))) * 1.3 || 1;
        const getY = (y) => MID - (y / maxY) * (MID * 0.75);
        const pathD = `M ${getX(data[0].x)} ${getY(data[0].y)} ` + data.slice(1).map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
        const fillD = `${pathD} L ${getX(data[data.length-1].x)} ${MID} L ${getX(data[0].x)} ${MID} Z`;

        svg.innerHTML = `
            <defs><clipPath id="u"><rect x="0" y="0" width="800" height="${MID}"/></clipPath><clipPath id="dn"><rect x="0" y="${MID}" width="800" height="${MID}"/></clipPath></defs>
            <path d="${fillD}" fill="var(--success)" opacity="0.12" clip-path="url(#u)"/><path d="${fillD}" fill="var(--danger)" opacity="0.12" clip-path="url(#dn)"/>
            <line x1="0" y1="${MID}" x2="800" y2="${MID}" stroke="#475569" stroke-width="1.5"/>
            <path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>
            <g><line x1="${getX(spot)}" y1="0" x2="${getX(spot)}" y2="${H}" stroke="white" stroke-dasharray="5" opacity="0.3"/><text x="${getX(spot)}" y="15" fill="white" font-size="10" text-anchor="middle" font-weight="900">SPOT</text></g>
            ${beps.map(b => `<g><circle cx="${getX(b.x)}" cy="${MID}" r="5" fill="#fbbf24"/><text x="${getX(b.x)}" y="${MID+22}" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">${d.bep} ${b.x.toFixed(1)}</text></g>`).join('')}
            <line id="v-line" y1="0" y2="${H}" stroke="white" stroke-dasharray="4" style="display:none; pointer-events:none;"/>
        `;

        svg.onmousemove = (e) => {
            const rect = svg.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width);
            const item = data.reduce((a, b) => Math.abs(getX(b.x)-mx) < Math.abs(getX(a.x)-mx) ? b : a);
            const tt = document.getElementById('chart-tooltip');
            tt.style.display = 'block';
            let ttX = e.clientX - rect.left + 20;
            if (ttX + 160 > rect.width) ttX = e.clientX - rect.left - 160; // 邊緣偵測切換至左邊
            tt.style.left = ttX + 'px';
            tt.style.top = (e.clientY - rect.top - 60) + 'px';
            tt.innerHTML = `<div style="color:var(--secondary); font-size:10px; margin-bottom:2px;">PRICE</div><b style="font-size:14px;">$${item.x.toFixed(2)}</b><hr style="border:0; border-top:1px solid #334155; margin:6px 0;"><div style="color:var(--secondary); font-size:10px; margin-bottom:2px;">EST. P/L</div><b style="color:${item.y>=0?'var(--success)':'var(--danger)'}; font-size:14px;">$${(item.y*100).toFixed(0)}</b>`;
        };
        svg.onmouseleave = () => { document.getElementById('chart-tooltip').style.display = 'none'; };
    }
    window.onload = () => setLanguage('en');
</script>
</body>
</html>
