<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Strategy Lab - 2026 Edition</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --text: #0f172a;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 480px; }
        
        /* 語言切換按鈕 */
        .lang-switch { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .lang-btn { background: none; border: 1px solid var(--secondary); color: var(--secondary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: 5px; }
        .lang-btn.active { background: var(--secondary); color: white; }

        h2 { text-align: center; margin: 0 0 20px 0; font-size: 20px; color: var(--primary); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--secondary); }
        input, select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        
        button#calcBtn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        
        #chart-container { margin-top: 20px; height: 200px; background: #f1f5f9; border-radius: 10px; border: 1px solid #e2e8f0; }
        #result-display { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
        .pos { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .neg { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
        .footer { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>

    <h2 id="ui-title">Options Strategy Simulator</h2>

    <div class="input-group">
        <label id="ui-strategy-label">Strategy</label>
        <select id="strategySelect" onchange="updateFields()">
            <!-- 選項由 JS 動態生成以支援多語系 -->
        </select>
    </div>

    <div class="grid">
        <div class="input-group">
            <label id="ui-s1">Strike 1</label>
            <input type="number" id="s1" value="100">
        </div>
        <div class="input-group" id="boxS2" style="display:none;">
            <label id="ui-s2">Strike 2</label>
            <input type="number" id="s2" value="110">
        </div>
        <div class="input-group" id="boxS3" style="display:none;">
            <label id="ui-s3">Strike 3</label>
            <input type="number" id="s3" value="120">
        </div>
        <div class="input-group" id="boxS4" style="display:none;">
            <label id="ui-s4">Strike 4</label>
            <input type="number" id="s4" value="130">
        </div>
        <div class="input-group">
            <label id="ui-premium">Net Premium ($)</label>
            <input type="number" id="premium" value="5">
        </div>
        <div class="input-group">
            <label id="ui-target">Target Price ($)</label>
            <input type="number" id="target" value="105">
        </div>
    </div>

    <button id="calcBtn" onclick="runCalculation()">Calculate & Visualize</button>

    <div id="result-display"></div>

    <div id="chart-container">
        <svg id="mainChart" viewBox="0 0 400 200" preserveAspectRatio="none" style="width:100%; height:100%;"></svg>
    </div>

    <div class="footer" id="ui-footer">* P/L based on expiration. Risk capital at stake.</div>
</div>

<script>
/**
 * 語系資料定義
 */
const i18n = {
    en: {
        title: "Options Strategy Lab",
        strategy: "Strategy",
        calc: "Calculate & Visualize",
        footer: "* P/L based on expiration. Risk capital at stake.",
        s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4",
        premium: "Net Premium ($)", target: "Target Price ($)",
        res: "Estimated P/L: ",
        opt: {
            long_call: "Long Call", short_call: "Short Call",
            long_put: "Long Put", short_put: "Short Put",
            bull_call: "Bull Call Spread", bear_put: "Bear Put Spread",
            straddle: "Straddle", strangle: "Strangle",
            butterfly: "Butterfly Spread", iron_condor: "Iron Condor"
        }
    },
    zh: {
        title: "期權策略模擬器",
        strategy: "選擇策略",
        calc: "計算並繪製圖表",
        footer: "* 損益計算基於到期日結算，交易涉及風險。",
        s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4",
        premium: "淨權利金 ($)", target: "結算預估價 ($)",
        res: "預估損益: ",
        opt: {
            long_call: "買入買權 (Long Call)", short_call: "賣出買權 (Short Call)",
            long_put: "買入賣權 (Long Put)", short_put: "賣出賣權 (Short Put)",
            bull_call: "牛市買權價差 (Bull Call)", bear_put: "熊市賣權價差 (Bear Put)",
            straddle: "跨式組合 (Straddle)", strangle: "勒式組合 (Strangle)",
            butterfly: "蝴蝶價差 (Butterfly)", iron_condor: "鐵鷹策略 (Iron Condor)"
        }
    }
};

let currentLang = 'en';

/**
 * 語系切換函數
 */
function setLanguage(lang) {
    currentLang = lang;
    
    // 更新按鈕樣式
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === lang || (lang === 'zh' && btn.innerText === '中文'));
    });

    // 更新靜態文字
    document.getElementById('ui-title').innerText = i18n[lang].title;
    document.getElementById('ui-strategy-label').innerText = i18n[lang].strategy;
    document.getElementById('calcBtn').innerText = i18n[lang].calc;
    document.getElementById('ui-footer').innerText = i18n[lang].footer;
    document.getElementById('ui-s1').innerText = i18n[lang].s1;
    document.getElementById('ui-s2').innerText = i18n[lang].s2;
    document.getElementById('ui-s3').innerText = i18n[lang].s3;
    document.getElementById('ui-s4').innerText = i18n[lang].s4;
    document.getElementById('ui-premium').innerText = i18n[lang].premium;
    document.getElementById('ui-target').innerText = i18n[lang].target;

    // 更新 Select 選項
    const select = document.getElementById('strategySelect');
    const val = select.value || 'long_call';
    select.innerHTML = '';
    for (const [key, text] of Object.entries(i18n[lang].opt)) {
        const opt = new Option(text, key);
        if (key === val) opt.selected = true;
        select.add(opt);
    }
    updateFields();
}

/**
 * 根據策略顯示對應的履約價欄位
 */
function updateFields() {
    const strategy = document.getElementById('strategySelect').value;
    const b2 = document.getElementById('boxS2'), b3 = document.getElementById('boxS3'), b4 = document.getElementById('boxS4');
    
    b2.style.display = b3.style.display = b4.style.display = 'none';

    if (['bull_call', 'bear_put', 'strangle'].includes(strategy)) {
        b2.style.display = 'block';
    } else if (strategy === 'butterfly') {
        b2.style.display = b3.style.display = 'block';
    } else if (strategy === 'iron_condor') {
        b2.style.display = b3.style.display = b4.style.display = 'block';
    }
}

/**
 * 核心損益計算邏輯
 */
function runCalculation() {
    const strategy = document.getElementById('strategySelect').value;
    const v1 = parseFloat(document.getElementById('s1').value);
    const v2 = parseFloat(document.getElementById('s2').value);
    const v3 = parseFloat(document.getElementById('s3').value);
    const v4 = parseFloat(document.getElementById('s4').value);
    const prem = parseFloat(document.getElementById('premium').value);
    const tgt = parseFloat(document.getElementById('target').value);

    // 計算特定價格下的 P/L (Per Share)
    const getProfit = (p) => {
        switch(strategy) {
            case 'long_call': return Math.max(0, p - v1) - prem;
            case 'short_call': return prem - Math.max(0, p - v1);
            case 'long_put': return Math.max(0, v1 - p) - prem;
            case 'short_put': return prem - Math.max(0, v1 - p);
            case 'bull_call': return (Math.max(0, p - v1) - Math.max(0, p - v2)) - prem;
            case 'bear_put': return (Math.max(0, v2 - p) - Math.max(0, v1 - p)) - prem;
            case 'straddle': return (Math.max(0, p - v1) + Math.max(0, v1 - p)) - prem;
            case 'strangle': return (Math.max(0, v1 - p) + Math.max(0, p - v2)) - prem;
            case 'butterfly': return (Math.max(0, p - v1) - 2 * Math.max(0, p - v2) + Math.max(0, p - v3)) - prem;
            case 'iron_condor': 
                const pSpread = Math.max(0, v1 - p) - Math.max(0, v2 - p);
                const cSpread = Math.max(0, p - v4) - Math.max(0, p - v3);
                return prem - (pSpread + cSpread);
            default: return 0;
        }
    };

    const finalPL = getProfit(tgt) * 100;
    const resDiv = document.getElementById('result-display');
    resDiv.style.display = 'block';
    resDiv.className = finalPL >= 0 ? 'pos' : 'neg';
    resDiv.innerText = `${i18n[currentLang].res} $${finalPL.toFixed(2)}`;

    // 繪圖點準備
    const xMin = v1 * 0.6, xMax = (v4 || v3 || v2 || v1) * 1.4;
    const steps = 50;
    let points = [];
    for(let i=0; i<=steps; i++) {
        let px = xMin + (i * (xMax - xMin) / steps);
        points.push([px, getProfit(px)]);
    }
    // 加入關鍵履約價點確保精確折線
    [v1, v2, v3, v4, tgt].forEach(v => { if(v) points.push([v, getProfit(v)]); });
    points.sort((a,b) => a[0] - b[0]);

    drawSVGChart(points, xMin, xMax);
}

/**
 * SVG 渲染引擎
 */
function drawSVGChart(pts, xMin, xMax) {
    const svg = document.getElementById('mainChart');
    const W = 400, H = 200, MID = H / 2;

    const getX = (x) => ((x - xMin) / (xMax - xMin)) * W;
    const maxY = Math.max(...pts.map(p => Math.abs(p[1]))) * 1.3 || 1;
    const getY = (y) => MID - (y / maxY) * (H / 2.5);

    let d = `M ${getX(pts[0][0])} ${getY(pts[0][1])}`;
    pts.forEach(p => { d += ` L ${getX(p[0])} ${getY(p[1])}`; });

    svg.innerHTML = `
        <line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="#cbd5e1" />
        <path d="${d}" fill="none" stroke="#2563eb" stroke-width="3" />
    `;
}

// 初始化
setLanguage('en');
</script>

</body>
</html>
