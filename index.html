<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Options Lab | Options Strategy Visualizer</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --secondary: #94a3b8; 
            --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --input-bg: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { background: var(--card); padding: 24px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 600px; border: 1px solid rgba(255,255,255,0.1); }
        .ad-box { width: 100%; max-width: 600px; min-height: 80px; margin: 10px 0; background: rgba(255,255,255,0.02); border-radius: 12px; display: none; align-items: center; justify-content: center; color: var(--secondary); font-size: 12px; border: 1px dashed rgba(255,255,255,0.2); text-align: center; padding: 10px; box-sizing: border-box; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
        .lang-btn { background: var(--input-bg); border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text); transition: 0.2s; }
        .lang-btn.active { background: var(--primary) !important; color: #000 !important; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: var(--secondary); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; background: var(--input-bg); color: white; outline: none; box-sizing: border-box; }
        button#calcBtn { width: 100%; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        #summary-panel { margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .data-card { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .data-label { display: block; font-size: 9px; font-weight: 800; color: var(--secondary); margin-bottom: 4px; text-transform: uppercase; }
        .data-val { font-size: 15px; font-weight: 800; word-break: break-all; }
        #chart-wrapper { position: relative; margin-top: 20px; background: #000; border-radius: 14px; height: 320px; border: 1px solid rgba(255,255,255,0.05); }
        svg { width: 100%; height: 100%; display: block; }
        .tooltip { position: absolute; background: rgba(15, 23, 42, 0.98); padding: 10px; border-radius: 6px; font-size: 11px; color: white; pointer-events: none; display: none; border: 1px solid var(--primary); z-index: 1000; }
    </style>
</head>
<body>

<div id="ad-top" class="ad-box">SEO Content Loading...</div>

<div class="container">
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
        <button id="btn-zh" class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>
    <h1 id="ui-title">Pro Options Lab</h1>
    <div class="grid">
        <div class="full-width"><label id="ui-strategy">Strategy</label><select id="strategySelect" onchange="handleStrategyChange()"></select></div>
        <div><label id="ui-s1">Strike 1</label><input type="number" id="s1" value="100" oninput="handleInputChange()"></div>
        <div id="boxS2"><label id="ui-s2">Strike 2</label><input type="number" id="s2" value="110" oninput="handleInputChange()"></div>
        <div id="boxS3" style="display:none;"><label id="ui-s3">Strike 3</label><input type="number" id="s3" value="120" oninput="handleInputChange()"></div>
        <div id="boxS4" style="display:none;"><label id="ui-s4">Strike 4</label><input type="number" id="s4" value="130" oninput="handleInputChange()"></div>
        <div><label id="ui-premium">Net Prem ($)</label><input type="number" id="premium" step="0.1" value="3.5" oninput="handleInputChange()"></div>
        <div><label id="ui-target">Spot ($)</label><input type="number" id="target" value="105" oninput="handleInputChange()"></div>
    </div>
    <button id="calcBtn" onclick="runCalculation()">ANALYZE STRATEGY</button>
    <div id="summary-panel">
        <div class="data-card"><span class="data-label" id="ui-maxReward">Max Reward</span><span id="res-max-profit" class="data-val" style="color:var(--success)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-maxRisk">Max Risk</span><span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-probHint">Hint</span><span id="res-prob" class="data-val" style="color:var(--primary); font-size:11px;">--</span></div>
    </div>
    <div id="chart-wrapper"><div id="chart-tooltip" class="tooltip"></div><svg id="mainChart" viewBox="0 0 400 320"></svg></div>
</div>

<script>
    const AD_ENABLED = true;
    const i18n = {
        en: { title: "Pro Options Lab", strategy: "Strategy", s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4", premium: "Net Prem ($)", target: "Spot ($)", maxReward: "Max Profit", maxRisk: "Max Risk", probHint: "Strategy Hint", calc: "ANALYZE STRATEGY", price: "Price", pl: "P/L", bep: "BEP", unlimited: "Unlimited", profitZone: "MAX PROFIT", opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" }, hints: { bull: "Bullish", bear: "Bearish", neut: "Neutral", vol: "High Vol" } },
        zh: { title: "專業期權實驗室", strategy: "交易策略", s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4", premium: "權利金淨額", target: "目前股價", maxReward: "最大獲利", maxRisk: "最大風險", probHint: "策略特性", calc: "一鍵分析策略", price: "股價", pl: "損益", bep: "損益點", unlimited: "理論無限", profitZone: "獲利區間", opt: { long_call: "買入買權", short_call: "賣出買權", long_put: "買入賣權", short_put: "賣出賣權", bull_call: "牛市買權價差", bear_put: "熊市賣權價差", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" }, hints: { bull: "看多策略", bear: "看空策略", neut: "中性/賺Theta", vol: "做多波動" } }
    };

    let currentLang = 'en';

    function resetOutput() {
        document.getElementById('res-max-profit').innerText = '--';
        document.getElementById('res-max-loss').innerText = '--';
        document.getElementById('res-prob').innerText = '--';
        document.getElementById('mainChart').innerHTML = '';
    }

    function handleStrategyChange() {
        resetOutput();
        updateFields();
        updateSEOAds(document.getElementById('strategySelect').value);
    }

    function handleInputChange() {
        resetOutput();
    }

    function setLanguage(lang) {
        currentLang = lang;
        const d = i18n[lang];
        document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
        document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
        
        const uiMap = ['title','strategy','s1','s2','s3','s4','premium','target','maxReward','maxRisk','probHint'];
        uiMap.forEach(id => { if(document.getElementById('ui-'+id)) document.getElementById('ui-'+id).innerText = d[id]; });
        document.getElementById('calcBtn').innerText = d.calc;

        const select = document.getElementById('strategySelect');
        const curVal = select.value || 'long_call';
        select.innerHTML = Object.entries(d.opt).map(([k,v]) => `<option value="${k}" ${k===curVal?'selected':''}>${v}</option>`).join('');
        
        updateSEOAds(curVal);
        if(document.getElementById('res-max-profit').innerText !== '--') runCalculation();
    }

    function updateFields() {
        const s = document.getElementById('strategySelect').value;
        document.getElementById('boxS2').style.display = ['long_call','short_call','long_put','short_put'].includes(s) ? 'none' : 'block';
        document.getElementById('boxS3').style.display = ['butterfly','iron_condor'].includes(s) ? 'block' : 'none';
        document.getElementById('boxS4').style.display = (s === 'iron_condor') ? 'block' : 'none';
    }

    function getP(p, s, v1, v2, v3, v4, prem) {
        switch(s) {
            case 'long_call': return Math.max(0, p - v1) - prem;
            case 'short_call': return prem - Math.max(0, p - v1);
            case 'long_put': return Math.max(0, v1 - p) - prem;
            case 'short_put': return prem - Math.max(0, v1 - p);
            case 'bull_call': return (Math.max(0, p - v1) - Math.max(0, p - v2)) - prem;
            case 'bear_put': return (Math.max(0, v2 - p) - Math.max(0, v1 - p)) - prem;
            case 'butterfly': return (Math.max(0, p - v1) - 2 * Math.max(0, p - v2) + Math.max(0, p - v3)) - prem;
            case 'iron_condor': return prem - Math.max(0, v1 - p) - Math.max(0, p - v4);
            default: return 0;
        }
    }

    function runCalculation() {
        const s = document.getElementById('strategySelect').value;
        const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value) || 0);
        const prem = parseFloat(document.getElementById('premium').value) || 0, S = parseFloat(document.getElementById('target').value) || 0;
        const dL = i18n[currentLang];

        let mP = 0, mL = 0, h = dL.hints.neut;
        if(s.includes('call')) h = dL.hints.bull; else if(s.includes('put')) h = dL.hints.bear;
        if(s === 'butterfly' || s === 'iron_condor') h = dL.hints.neut;

        switch(s) {
            case 'long_call': case 'long_put': mP = dL.unlimited; mL = prem * 100; break;
            case 'short_call': case 'short_put': mP = prem * 100; mL = dL.unlimited; break;
            case 'bull_call': case 'bear_put': mP = (Math.abs(v[1]-v[0])-prem)*100; mL = prem*100; break;
            case 'butterfly': mP = (v[1]-v[0]-prem)*100; mL = prem*100; break;
            case 'iron_condor': mP = prem*100; mL = (v[1]-v[0]-prem)*100; break;
        }

        document.getElementById('res-max-profit').innerText = typeof mP === 'number' ? `$${mP.toFixed(0)}` : mP;
        document.getElementById('res-max-loss').innerText = typeof mL === 'number' ? `$${mL.toFixed(0)}` : mL;
        document.getElementById('res-prob').innerText = h;

        let center = v[0];
        if(s==='butterfly') center = v[1]; else if(s==='iron_condor') center = (v[1]+v[2])/2; else if(s.includes('spread')) center = (v[0]+v[1])/2;
        
        const range = Math.max(Math.abs(center-v[0]), Math.abs(center-S), 30) * 1.6;
        const xMin = center - range, xMax = center + range;

        let data = [], beps = [];
        for(let i=0; i<=200; i++) {
            let p = xMin + (i * (xMax - xMin) / 200);
            let y = getP(p, s, v[0], v[1], v[2], v[3], prem);
            data.push({x: p, y: y});
            if (i > 0 && ((data[i-1].y < 0 && y >= 0) || (data[i-1].y > 0 && y <= 0))) beps.push({x: p});
        }
        drawSVG(data, xMin, xMax, S, beps, {s, v, prem});
    }

    function drawSVG(data, xMin, xMax, spot, beps, info) {
        const svg = document.getElementById('mainChart'), W = 400, H = 320, MID = H/2, d = i18n[currentLang];
        const getX = (x) => ((x - xMin) / (xMax - xMin)) * W;
        const maxY = Math.max(...data.map(p => Math.abs(p.y))) * 1.25 || 1;
        const getY = (y) => MID - (y / maxY) * (MID * 0.75);

        let highlight = '';
        if(info.s==='butterfly') {
            highlight = `<circle cx="${getX(info.v[1])}" cy="${getY(getP(info.v[1],info.s,info.v[0],info.v[1],info.v[2],info.v[3],info.prem))}" r="4" fill="var(--primary)"/><text x="${getX(info.v[1])}" y="${getY(getP(info.v[1],info.s,info.v[0],info.v[1],info.v[2],info.v[3],info.prem))-8}" fill="var(--primary)" font-size="8" text-anchor="middle" font-weight="900">${d.profitZone}</text>`;
        } else if(info.s==='iron_condor') {
            highlight = `<line x1="${getX(info.v[1])}" y1="${getY(info.prem)}" x2="${getX(info.v[2])}" y2="${getY(info.prem)}" stroke="var(--primary)" stroke-width="3"/><text x="${(getX(info.v[1])+getX(info.v[2]))/2}" y="${getY(info.prem)-8}" fill="var(--primary)" font-size="8" text-anchor="middle" font-weight="900">${d.profitZone}</text>`;
        }

        const pathD = `M ${getX(data[0].x)} ${getY(data[0].y)} ` + data.slice(1).map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
        const fillD = `${pathD} L ${getX(data[data.length-1].x)} ${MID} L ${getX(data[0].x)} ${MID} Z`;

        svg.innerHTML = `
            <defs><clipPath id="u"><rect x="0" y="0" width="400" height="${MID}"/></clipPath><clipPath id="dn"><rect x="0" y="${MID}" width="400" height="${MID}"/></clipPath></defs>
            <path d="${fillD}" fill="var(--success)" opacity="0.15" clip-path="url(#u)"/><path d="${fillD}" fill="var(--danger)" opacity="0.15" clip-path="url(#dn)"/>
            <line x1="0" y1="${MID}" x2="400" y2="${MID}" stroke="#475569"/><path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>
            ${highlight}
            <g><line x1="${getX(spot)}" y1="0" x2="${getX(spot)}" y2="${H}" stroke="white" stroke-dasharray="4" opacity="0.3"/><text x="${getX(spot)}" y="12" fill="white" font-size="8" text-anchor="middle" font-weight="800">SPOT</text></g>
            ${beps.map(b => `<g><circle cx="${getX(b.x)}" cy="${MID}" r="4" fill="#fbbf24"/><text x="${getX(b.x)}" y="${MID+18}" fill="#fbbf24" font-size="9" font-weight="900" text-anchor="middle">${d.bep} ${b.x.toFixed(1)}</text></g>`).join('')}
            <line id="v-line" y1="0" y2="${H}" stroke="white" stroke-dasharray="4" style="display:none; pointer-events:none;"/>
        `;

        svg.onmousemove = (e) => {
            const rect = svg.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (400 / rect.width);
            const item = data.reduce((a, b) => Math.abs(getX(b.x)-mx) < Math.abs(getX(a.x)-mx) ? b : a);
            const vl = svg.getElementById('v-line'), tt = document.getElementById('chart-tooltip');
            vl.setAttribute('x1', getX(item.x)); vl.setAttribute('x2', getX(item.x)); vl.style.display = 'block';
            tt.style.display = 'block'; tt.style.left = (e.clientX - rect.left + 15) + 'px'; tt.style.top = (e.clientY - rect.top - 50) + 'px';
            tt.innerHTML = `<b>$${item.x.toFixed(2)}</b><br><span style="color:${item.y>=0?'#4ade80':'#f87171'}">${d.pl}: $${(item.y*100).toFixed(0)}</span>`;
        };
        svg.onmouseleave = () => { svg.getElementById('v-line').style.display = document.getElementById('chart-tooltip').style.display = 'none'; };
    }

    function updateSEOAds(strategy) {
        if(!AD_ENABLED) return;
        const d = i18n[currentLang];
        const sName = d.opt[strategy];
        const top = document.getElementById('ad-top');
        top.innerHTML = currentLang === 'en' ? `Advanced <b>${sName}</b> Risk Visualizer. Professional Options Trading Tools.` : `專業 <b>${sName}</b> 風險視覺化工具，精確掌控期權損益。`;
        top.style.display = 'flex';
    }

    window.onload = () => setLanguage('en');
</script>
</body>
</html>
