<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 美國市場核心 SEO 標籤 -->
    <title>Options Profit Calculator | Visual Strategy Simulator 2026</title>
    <meta name="description" content="Free real-time options profit calculator. Visualize P/L charts for Iron Condors, Spreads, and more. Calculate max risk, reward, and break-even points instantly.">
    <meta name="keywords" content="options profit calculator, options strategy visualizer, iron condor simulator, options trading tools 2026, max risk reward calculator">
    <link rel="canonical" href="https://yourusername.github.io" />

    <!-- Schema.org JSON-LD (美國 Google 最看重的結構化資料) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Professional Options Strategy Simulator",
      "operatingSystem": "Web",
      "applicationCategory": "FinanceApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Interactive P/L Charts",
        "Max Risk/Reward Calculation",
        "10+ Options Strategies supported"
      ]
    }
    </script>

    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; --secondary: #64748b; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; --text: #0f172a; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; margin: 0; }
        .container { background: var(--card); padding: 24px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; max-width: 540px; }
        
        .lang-switch { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
        .lang-btn { background: #f1f5f9; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--secondary); }
        .lang-btn.active { background: var(--primary); color: white; }

        .ad-slot { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; margin: 15px 0; text-align: center; color: #94a3b8; font-size: 11px; display: flex; align-items: center; justify-content: center; min-height: 90px; }

        h1 { text-align: center; margin: 0; font-size: 24px; color: var(--primary); letter-spacing: -1px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 4px; color: var(--secondary); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #fff; }
        
        button#calcBtn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }

        #summary-panel { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; display: none; }
        .data-card { background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .full-card { grid-column: span 2; }
        .data-label { display: block; font-size: 11px; font-weight: 800; color: var(--secondary); margin-bottom: 6px; }
        .data-val { font-size: 18px; font-weight: 800; }
        .prob-tag { color: #1d4ed8; font-weight: 700; font-size: 13px; margin-top: 4px; }

        #chart-wrapper { position: relative; margin-top: 20px; background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; height: 340px; }
        svg { width: 100%; height: 100%; display: block; }
        
        /* SEO 文字區塊 - 美國 Google 爬蟲最愛 */
        article { font-size: 13px; color: #64748b; line-height: 1.6; margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">繁體中文</button>
    </div>

    <h1 id="ui-title">Options Strategy Simulator</h1>

    <div class="ad-slot">AdSense Placeholder</div>

    <div class="input-group">
        <label id="ui-strategy-label">Strategy</label>
        <select id="strategySelect" onchange="updateFields()"></select>
    </div>

    <div class="grid">
        <div><label id="ui-s1">Strike 1</label><input type="number" id="s1" value="100"></div>
        <div id="boxS2" style="display:none;"><label id="ui-s2">Strike 2</label><input type="number" id="s2" value="110"></div>
        <div id="boxS3" style="display:none;"><label id="ui-s3">Strike 3</label><input type="number" id="s3" value="120"></div>
        <div id="boxS4" style="display:none;"><label id="ui-s4">Strike 4</label><input type="number" id="s4" value="130"></div>
        <div><label id="ui-premium">Total Premium ($)</label><input type="number" id="premium" value="5"></div>
        <div><label id="ui-target">Target Price ($)</label><input type="number" id="target" value="115"></div>
    </div>

    <button id="calcBtn" onclick="runCalculation()">Analyze Risk & Reward</button>

    <div id="summary-panel">
        <div class="data-card">
            <span class="data-label" id="ui-max-reward-label">Max Reward</span>
            <span id="res-max-profit" class="data-val" style="color:var(--success)">--</span>
        </div>
        <div class="data-card">
            <span class="data-label" id="ui-max-risk-label">Max Risk</span>
            <span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span>
        </div>
        <div class="data-card full-card">
            <span class="data-label" id="ui-prob-label">Win Probability Hint</span>
            <div id="res-prob" class="prob-tag">--</div>
        </div>
    </div>

    <div id="chart-wrapper">
        <svg id="mainChart" viewBox="0 0 400 340"></svg>
    </div>

    <!-- SEO 文章區塊 - 提高專業度權重 -->
    <article id="ui-article">
        <h3>How to Calculate Option Profits?</h3>
        <p>Using a visual options simulator allows you to understand the risk-reward profile of complex trades like Iron Condors or Vertical Spreads instantly.</p>
    </article>
</div>

<script>
const i18n = {
    en: {
        title: "Options Strategy Simulator", strategy: "Strategy", calc: "Analyze Risk & Reward",
        s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4",
        premium: "Total Premium", target: "Target Price",
        maxReward: "Max Reward", maxRisk: "Max Risk", prob: "Win Probability Hint",
        profit: "PROFIT", loss: "LOSS", bep: "BEP", unlimited: "Unlimited",
        probHigh: "High Win Rate / Low Reward (Seller)", 
        probLow: "Low Win Rate / High Reward (Buyer)", 
        probMid: "Neutral Probability",
        article: "<h3>Visualize Your Trades</h3><p>Understanding the payoff diagram is crucial for risk management. This tool helps you identify the max loss and profit zones for 10+ popular options strategies instantly.</p>",
        opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", straddle: "Straddle", strangle: "Strangle", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" }
    },
    zh: {
        title: "期權策略模擬器", strategy: "選擇交易策略", calc: "一鍵分析風險",
        s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4",
        premium: "淨權利金", target: "目標結算價",
        maxReward: "最大獲利", maxRisk: "最大風險", prob: "勝率特性提示",
        profit: "獲利區", loss: "虧損區", bep: "平衡點", unlimited: "理論無限",
        probHigh: "高勝率 / 低回報 (賣方策略)", 
        probLow: "低勝率 / 高回報 (買方策略)", 
        probMid: "勝率中性 (波動率策略)",
        article: "<h3>為什麼需要視覺化損益圖？</h3><p>期權交易並非線性的。透過此模擬器，您可以精確識別複雜策略（如鐵鷹或蝴蝶價差）在不同價格點的損益表現，從而更有效地管理交易風險。</p>",
        opt: { long_call: "買入買權 (Long Call)", short_call: "賣出買權 (Short Call)", long_put: "買入賣權 (Long Put)", short_put: "賣出賣權 (Short Put)", bull_call: "牛市價差", bear_put: "熊市價差", straddle: "跨式組合", strangle: "勒式組合", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" }
    }
};

let currentLang = 'en';

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
    
    const d = i18n[lang];
    document.getElementById('ui-title').innerText = d.title;
    document.getElementById('ui-strategy-label').innerText = d.strategy;
    document.getElementById('calcBtn').innerText = d.calc;
    document.getElementById('ui-s1').innerText = d.s1;
    document.getElementById('ui-s2').innerText = d.s2;
    document.getElementById('ui-s3').innerText = d.s3;
    document.getElementById('ui-s4').innerText = d.s4;
    document.getElementById('ui-premium').innerText = d.premium;
    document.getElementById('ui-target').innerText = d.target;
    document.getElementById('ui-max-reward-label').innerText = d.maxReward;
    document.getElementById('ui-max-risk-label').innerText = d.maxRisk;
    document.getElementById('ui-prob-label').innerText = d.prob;
    document.getElementById('ui-article').innerHTML = d.article;

    const select = document.getElementById('strategySelect');
    const oldVal = select.value || 'long_call';
    select.innerHTML = '';
    for (const of Object.entries(d.opt)) {
        const opt = new Option(text, key);
        if (key === oldVal) opt.selected = true;
        select.add(opt);
    }
    updateFields();
}

function updateFields() {
    const s = document.getElementById('strategySelect').value;
    document.getElementById('boxS2').style.display = ['bull_call','bear_put','strangle','butterfly','iron_condor'].includes(s) ? 'block' : 'none';
    document.getElementById('boxS3').style.display = ['butterfly','iron_condor'].includes(s) ? 'block' : 'none';
    document.getElementById('boxS4').style.display = (s === 'iron_condor') ? 'block' : 'none';
}

function getP(p, s, v1, v2, v3, v4, prem) {
    switch(s) {
        case 'long_call': return Math.max(0, p - v1) - prem;
        case 'short_call': return prem - Math.max(0, p - v1);
        case 'long_put': return Math.max(0, v1 - p) - prem;
        case 'short_put': return prem - Math.max(0, v1 - p);
        case 'bull_call': return (Math.max(0, p - v1) - Math.max(0, p - v2)) - prem;
        case 'bear_put': return (Math.max(0, v2 - p) - Math.max(0, v1 - p)) - prem;
        case 'straddle': return (Math.max(0, p - v1) + Math.max(0, v1 - p)) - prem;
        case 'strangle': return (Math.max(0, v1 - p) + Math.max(0, p - v2)) - prem;
        case 'butterfly': return (Math.max(0, p - v1) - 2 * Math.max(0, p - v2) + Math.max(0, p - v3)) - prem;
        case 'iron_condor': return prem - (Math.max(0, v1 - p) - Math.max(0, v2 - p) + Math.max(0, p - v4) - Math.max(0, p - v3));
        default: return 0;
    }
}

function runCalculation() {
    const strategy = document.getElementById('strategySelect').value;
    const v1 = parseFloat(document.getElementById('s1').value), v2 = parseFloat(document.getElementById('s2').value);
    const v3 = parseFloat(document.getElementById('s3').value), v4 = parseFloat(document.getElementById('s4').value);
    const prem = parseFloat(document.getElementById('premium').value), tgt = parseFloat(document.getElementById('target').value);

    let mP = 0, mL = 0, prb = "";
    const lang = i18n[currentLang];

    switch(strategy) {
        case 'long_call': mP = lang.unlimited; mL = prem * 100; prb = lang.probLow; break;
        case 'short_call': mP = prem * 100; mL = lang.unlimited; prb = lang.probHigh; break;
        case 'long_put': mP = (v1-prem)*100; mL = prem * 100; prb = lang.probLow; break;
        case 'short_put': mP = prem * 100; mL = (v1-prem)*100; prb = lang.probHigh; break;
        case 'bull_call': mP = (v2-v1-prem)*100; mL = prem*100; prb = lang.probMid; break;
        case 'bear_put': mP = (v2-v1-prem)*100; mL = prem*100; prb = lang.probMid; break;
        case 'straddle': mP = lang.unlimited; mL = prem * 100; prb = lang.probLow; break;
        case 'strangle': mP = lang.unlimited; mL = prem * 100; prb = lang.probLow; break;
        case 'butterfly': mP = (v2-v1-prem)*100; mL = prem*100; prb = lang.probLow; break;
        case 'iron_condor': mP = prem*100; mL = (Math.max(v2-v1, v4-v3)-prem)*100; prb = lang.probHigh; break;
    }

    document.getElementById('summary-panel').style.display = 'grid';
    document.getElementById('res-max-profit').innerText = isNaN(mP) ? mP : `$${mP.toFixed(0)}`;
    document.getElementById('res-max-loss').innerText = isNaN(mL) ? mL : `$${mL.toFixed(0)}`;
    document.getElementById('res-prob').innerText = prb;

    const strikes = [v1, v2, v3, v4, tgt].filter(v => !isNaN(v));
    const xMin = Math.min(...strikes) * 0.85;
    const xMax = Math.max(...strikes) * 1.15;

    let pts = [];
    for(let i=0; i<=120; i++) {
        let x = xMin + (i * (xMax - xMin) / 120);
        pts.push({x: x, y: getP(x, strategy, v1, v2, v3, v4, prem)});
    }
    
    let beps = [];
    for(let i=1; i<pts.length; i++) {
        if((pts[i-1].y < 0 && pts[i].y >= 0) || (pts[i-1].y > 0 && pts[i].y <= 0)) {
            beps.push((pts[i-1].x + pts[i].x) / 2);
        }
    }
    drawFinalSVG(pts, xMin, xMax, tgt, beps, strategy, v1, v2, v3, v4, prem);
}

function drawFinalSVG(pts, xMin, xMax, tgt, beps, strategy, v1, v2, v3, v4, prem) {
    const svg = document.getElementById('mainChart');
    const W = 400, H = 340, MID = H / 2;
    const getX = (x) => ((x - xMin) / (xMax - xMin)) * W;
    const maxY = Math.max(...pts.map(p => Math.abs(p.y))) * 1.6 || 1;
    const getY = (y) => MID - (y / maxY) * (H / 2.8);

    let d = `M ${getX(pts[0].x)} ${getY(pts[0].y)}`;
    pts.forEach(p => d += ` L ${getX(p.x)} ${getY(p.y)}`);

    const tgtPL = getP(tgt, strategy, v1, v2, v3, v4, prem) * 100;

    svg.innerHTML = `
        <rect width="${W}" height="${MID}" fill="rgba(34,197,94,0.06)" />
        <rect y="${MID}" width="${W}" height="${MID}" fill="rgba(239,68,68,0.06)" />
        <line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="#94a3b8" stroke-width="1.5" />
        <path d="${d}" fill="none" stroke="var(--primary)" stroke-width="3" />

        <text x="10" y="25" font-size="11" font-weight="900" fill="var(--success)">▲ ${i18n[currentLang].profit}</text>
        <text x="10" y="${H-15}" font-size="11" font-weight="900" fill="var(--danger)">▼ ${i18n[currentLang].loss}</text>

        ${beps.map(b => `
            <circle cx="${getX(b)}" cy="${MID}" r="5" fill="var(--warning)" stroke="#fff" stroke-width="2" />
            <text x="${getX(b)}" y="${MID + 22}" font-size="11" font-weight="900" text-anchor="middle" fill="#b45309">$${b.toFixed(1)}</text>
        `).join('')}

        <line x1="${getX(tgt)}" y1="0" x2="${getX(tgt)}" y2="${H}" stroke="#0f172a" stroke-dasharray="4,4" />
        <g transform="translate(${getX(tgt)}, ${getY(tgtPL/100)})">
            <rect x="-35" y="-35" width="70" height="24" rx="6" fill="#0f172a" />
            <text x="0" y="-19" font-size="12" font-weight="900" fill="white" text-anchor="middle">$${tgtPL.toFixed(0)}</text>
            <path d="M -5 -11 L 0 -5 L 5 -11 Z" fill="#0f172a" />
        </g>
        <text x="${getX(tgt)}" y="${H-5}" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">Target: $${tgt}</text>
    `;
}

setLanguage('en');
</script>
</body>
</html>
