<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Options Lab | Free Options Profit Calculator & Strategy Visualizer</title>
    <meta name="description" content="Free professional options profit calculator. Visualize Iron Condor, Butterfly, and Spreads. Analyze max risk, reward, and break-even points instantly.">
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --secondary: #94a3b8; 
            --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --input-bg: #334155;
            --buy: #38bdf8; --sell: #fb7185;
        }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--card); padding: 35px; border-radius: 28px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); width: 100%; max-width: 1000px; border: 1px solid rgba(255,255,255,0.1); }
        .lang-switch { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 25px; }
        .lang-btn { background: var(--input-bg); border: none; padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 13px; color: var(--text); transition: 0.3s; }
        .lang-btn.active { background: var(--primary) !important; color: #000 !important; font-weight: 800; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; margin-top: 15px; }
        .full-width { grid-column: 1 / -1; }
        .field-group { display: flex; flex-direction: column; }
        .extra-strike { display: none; } 

        label { display: flex; align-items: center; font-size: 11px; font-weight: 800; margin-bottom: 12px; color: var(--secondary); text-transform: uppercase; white-space: nowrap; }
        .op-tag { font-size: 9px; padding: 3px 8px; border-radius: 6px; margin-left: 10px; font-weight: 900; }
        .tag-buy { background: rgba(56, 189, 248, 0.15); color: var(--buy); border: 1px solid var(--buy); }
        .tag-sell { background: rgba(251, 113, 133, 0.15); color: var(--sell); border: 1px solid var(--sell); }
        
        input, select { width: 100%; padding: 15px; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; font-size: 15px; background: var(--input-bg); color: white; outline: none; }
        button#calcBtn { width: 100%; padding: 22px; background: var(--primary); color: #000; border: none; border-radius: 18px; font-size: 18px; font-weight: 900; cursor: pointer; margin-top: 35px; }
        button#calcBtn:disabled { opacity: 0.15; cursor: not-allowed; }
        
        #summary-panel { margin-top: 35px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .data-card { background: rgba(255,255,255,0.02); padding: 22px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .data-label { display: block; font-size: 10px; font-weight: 800; color: var(--secondary); margin-bottom: 10px; text-transform: uppercase; }
        .data-val { font-size: 20px; font-weight: 900; }
        
        .ad-container { grid-column: span 3; background: #1a2235; min-height: 90px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: var(--secondary); font-size: 12px; border: 1px dashed rgba(255,255,255,0.1); margin-top: 20px; }

        #chart-wrapper { position: relative; margin-top: 35px; background: #000; border-radius: 24px; height: 400px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
        .tooltip { position: absolute; background: rgba(15, 23, 42, 0.98); padding: 15px; border-radius: 12px; font-size: 12px; color: white; pointer-events: none; border: 1px solid var(--primary); z-index: 1000; min-width: 170px; display: none; }

        .seo-content { max-width: 1000px; margin-top: 50px; color: var(--secondary); line-height: 1.8; font-size: 0.95rem; padding-bottom: 50px; }
        .seo-content h2 { color: var(--text); border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 30px; }
        .seo-content h4 { color: var(--primary); margin-top: 20px; margin-bottom: 5px; }
        .disclaimer { font-size: 0.8rem; margin-top: 40px; border-top: 1px solid #334155; padding-top: 15px; opacity: 0.6; }
    </style>
</head>
<body>

<main class="container">
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
        <button id="btn-zh" class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>
    <h1 id="ui-title">Pro Options Lab</h1>
    <div class="grid">
        <div class="full-width field-group"><label id="ui-strategy">Strategy</label><select id="strategySelect" onchange="handleStrategyChange()"></select></div>
        <div class="field-group"><label><span id="ui-s1">Strike 1</span><span id="tag-s1" class="op-tag"></span></label><input type="number" id="s1" value="95" oninput="handleInputChange()"></div>
        <div id="boxS2" class="field-group extra-strike"><label><span id="ui-s2">Strike 2</span><span id="tag-s2" class="op-tag"></span></label><input type="number" id="s2" value="100" oninput="handleInputChange()"></div>
        <div id="boxS3" class="field-group extra-strike"><label><span id="ui-s3">Strike 3</span><span id="tag-s3" class="op-tag"></span></label><input type="number" id="s3" value="110" oninput="handleInputChange()"></div>
        <div id="boxS4" class="field-group extra-strike"><label><span id="ui-s4">Strike 4</span><span id="tag-s4" class="op-tag"></span></label><input type="number" id="s4" value="115" oninput="handleInputChange()"></div>
        <div class="field-group"><label id="ui-premium">Net Prem ($)</label><input type="number" id="premium" step="0.1" value="2.0" oninput="handleInputChange()"></div>
        <div class="field-group"><label id="ui-target">Spot ($)</label><input type="number" id="target" value="105" oninput="handleInputChange()"></div>
    </div>
    <button id="calcBtn" onclick="runCalculation()">ANALYZE STRATEGY</button>
    <div id="summary-panel">
        <div class="data-card"><span class="data-label" id="ui-maxReward">Max Profit</span><span id="res-max-profit" class="data-val" style="color:var(--success)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-maxRisk">Max Risk</span><span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span></div>
        <div class="data-card"><span class="data-label" id="ui-probHint">Logic Hint</span><span id="res-prob" class="data-val" style="color:var(--primary); font-size:12px;">--</span></div>
        <div class="ad-container" id="ad-slot">ADVERTISEMENT SLOT (GOOGLE ADSENSE)</div>
    </div>
    <div id="chart-wrapper"><div id="chart-tooltip" class="tooltip"></div><svg id="mainChart" viewBox="0 0 800 400" preserveAspectRatio="none"></svg></div>
</main>

<article id="seo-article" class="seo-content"></article>

<script>
    const i18n = {
        en: { 
            title: "Pro Options Lab", strategy: "Strategy", s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4", premium: "Net Prem ($)", target: "Spot ($)", maxReward: "Max Profit", maxRisk: "Max Risk", probHint: "Logic Hint", calc: "ANALYZE STRATEGY", price: "PRICE", pl: "EST. P/L", bep: "BEP", buy: "BUY", sell: "SELL", low: "Low", mid: "Mid", high: "High", call: "CALL", put: "PUT", unlimited: "Unlimited",
            opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" },
            hints: { ready: "Ready to Analyze", err: "Logic Error!", bull: "Bullish", bear: "Bearish", neut: "Neutral", vol: "Vol Play" },
            seo: `<h2>Mastering Your Options Trading with Visual Analysis</h2><p>Using an <strong>Options Profit Calculator</strong> is the most effective way to manage risk before entering a trade. Visualizing your potential profit and loss (P/L) allows you to understand exactly how market movements will impact your portfolio. At Pro Options Lab, we simplify complex derivatives into interactive graphs.</p><h3>Popular Strategies Explained</h3><h4>1. Iron Condor</h4><p>The <strong>Iron Condor</strong> is a neutral strategy designed to profit from low volatility in the underlying stock. It involves selling a bear call spread and a bull put spread simultaneously. Our visualizer helps you identify the "Profit Zone" between your two short strikes and calculates your break-even points automatically.</p><h4>2. Butterfly Spread</h4><p>A <strong>Butterfly Spread</strong> is a limited-risk, non-directional strategy that combines bull and bear spreads. Traders use our tool to pinpoint the peak profit potential, which occurs when the stock price stays exactly at the middle strike price upon expiration.</p><h4>3. Vertical Spreads (Bull Call & Bear Put)</h4><p>For directional traders, <strong>Bull Call Spreads</strong> and <strong>Bear Put Spreads</strong> are essential for reducing the cost of entry. By visualizing these spreads, you can clearly see the offset between the premium paid and the premium received, defining your absolute Maximum Risk and Maximum Reward.</p><h3>Why Use a P/L Graph?</h3><ul><li><strong>Risk Management:</strong> Know your maximum potential loss before you click "trade".</li><li><strong>Break-Even Points:</strong> Identify the exact stock price needed to start profiting.</li><li><strong>Strategic Planning:</strong> Compare different strike prices to find the optimal risk-to-reward ratio for your market outlook.</li></ul><div class="disclaimer"><em>Disclaimer: Options trading involves significant risk and is not suitable for all investors. Calculations are for educational purposes only and do not constitute financial advice.</em></div>`
        },
        zh: { 
            title: "專業期權分析實驗室", strategy: "交易策略", s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4", premium: "權利金淨額", target: "目前股價", maxReward: "最大獲利", maxRisk: "最大風險", probHint: "邏輯提示", calc: "一鍵分析策略損益", price: "標的價格", pl: "預計損益", bep: "損益平衡點", buy: "買入", sell: "賣出", low: "低", mid: "中", high: "高", call: "買權", put: "賣權", unlimited: "無限制",
            opt: { long_call: "買入買權", short_call: "賣出買權", long_put: "買入賣權", short_put: "賣出賣權", bull_call: "牛市買權價差", bear_put: "熊市賣權價差", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" },
            hints: { ready: "設定正確，請點擊分析", err: "價格排序錯誤！", bull: "看多策略", bear: "看空策略", neut: "中性策略", vol: "做多波動率" },
            seo: `<h2>透過視覺化圖表掌握您的選擇權交易</h2><p>在進入交易前，使用<strong>選擇權損益計算機</strong>是管理風險最有效的方式。視覺化您的潛在獲利與虧損 (P/L)，能讓您精確理解市場波動對部位的影響。我們將複雜的衍生性金融工具轉化為互動式圖表。</p><h3>熱門策略解析</h3><h4>1. 鐵鷹策略 (Iron Condor)</h4><p><strong>鐵鷹策略</strong>是一種中性策略，旨在從低波動率中獲利。它同時包含了賣出看漲價差與看跌價差。我們的視覺化工具能幫您識別「獲利區間」並自動計算損益平衡點。</p><h4>2. 蝴蝶價差 (Butterfly Spread)</h4><p><strong>蝴蝶價差</strong>是一種風險有限且非方向性的策略。交易者使用我們的工具來精確鎖定最大獲利點，這發生在股價於到期時正好停留在中間履約價的情況。</p><h4>3. 垂直價差 (牛市買權 & 熊市賣權)</h4><p>對於方向性交易者，<strong>牛市買權價差</strong>與<strong>熊市賣權價差</strong>是降低成本的關鍵。透過視覺化，您可以清楚看到權利金支出的抵銷，定義您的絕對最大風險與回報。</p><h3>為什麼要使用損益圖表？</h3><ul><li><strong>風險管理：</strong>在交易前了解您的最大潛在損失。</li><li><strong>損益平衡點：</strong>識別開始獲利所需的確切股價。</li><li><strong>策略規劃：</strong>優化風險回報比，找到最佳入場點。</li></ul><div class="disclaimer"><em>免責聲明：期權交易涉及重大風險。本工具提供的所有計算僅供教學參考，不構成任何財務建議。</em></div>`
        }
    };

    let currentLang = 'en', isCalculated = false;
    function hideTooltip() { const tt = document.getElementById('chart-tooltip'); if(tt) tt.style.display = 'none'; }
    function updateFields() {
        const s = document.getElementById('strategySelect').value || 'long_call';
        ['boxS2','boxS3','boxS4'].forEach(id => document.getElementById(id).style.display = 'none');
        if(!['long_call','short_call','long_put','short_put'].includes(s)) document.getElementById('boxS2').style.display = 'flex';
        if(['butterfly','iron_condor'].includes(s)) document.getElementById('boxS3').style.display = 'flex';
        if(s === 'iron_condor') document.getElementById('boxS4').style.display = 'flex';
    }

    function updateTags() {
        const s = document.getElementById('strategySelect').value, d = i18n[currentLang];
        ['tag-s1','tag-s2','tag-s3','tag-s4'].forEach(id => { const el = document.getElementById(id); if(el){ el.innerText=''; el.className='op-tag'; }});
        const set = (id, act, typ, pos) => { const el = document.getElementById('tag-'+id); if(el){ el.innerText=`${d[act]} ${d[typ]} (${d[pos]})`; el.className=`op-tag tag-${act}`; }};
        switch(s) {
            case 'long_call': set('s1','buy','call','low'); break;
            case 'short_call': set('s1','sell','call','low'); break;
            case 'long_put': set('s1','buy','put','low'); break;
            case 'short_put': set('s1','sell','put','low'); break;
            case 'bull_call': set('s1','buy','call','low'); set('s2','sell','call','high'); break;
            case 'bear_put': set('s1','sell','put','low'); set('s2','buy','put','high'); break;
            case 'butterfly': set('s1','buy','call','low'); set('s2','sell','call','mid'); set('s3','buy','call','high'); break;
            case 'iron_condor': set('s1','buy','put','low'); set('s2','sell','put','mid'); set('s3','sell','call','mid'); set('s4','buy','call','high'); break;
        }
    }

    function validateLogic() {
        const s = document.getElementById('strategySelect').value;
        const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value) || 0);
        const btn = document.getElementById('calcBtn'), hint = document.getElementById('res-prob'), d = i18n[currentLang];
        let valid = true;
        if (['bull_call', 'bear_put'].includes(s) && v[0] >= v[1]) valid = false;
        else if (s === 'butterfly' && (v[0] >= v[1] || v[1] >= v[2])) valid = false;
        else if (s === 'iron_condor' && (v[0] >= v[1] || v[1] >= v[2] || v[2] >= v[3])) valid = false;
        btn.disabled = !valid;
        if (!isCalculated) {
            document.getElementById('ui-probHint').innerText = d.probHint;
            hint.innerText = valid ? d.hints.ready : d.hints.err;
            hint.style.color = valid ? 'var(--primary)' : 'var(--danger)';
        }
        return valid;
    }

    function handleStrategyChange() { isCalculated = false; hideTooltip(); updateFields(); updateTags(); resetOutput(); validateLogic(); }
    function handleInputChange() { isCalculated = false; hideTooltip(); validateLogic(); resetOutput(); }
    function resetOutput() { document.getElementById('res-max-profit').innerText = '--'; document.getElementById('res-max-loss').innerText = '--'; document.getElementById('mainChart').innerHTML = ''; }

    // 核心損益邏輯修正 (特別是鐵鷹策略)
    function getP(p, s, v, prem) {
        switch(s) {
            case 'long_call': return Math.max(0, p - v[0]) - prem;
            case 'short_call': return prem - Math.max(0, p - v[0]);
            case 'long_put': return Math.max(0, v[0] - p) - prem;
            case 'short_put': return prem - Math.max(0, v[0] - p);
            case 'bull_call': return (Math.max(0, p - v[0]) - Math.max(0, p - v[1])) - prem;
            case 'bear_put': return (Math.max(0, v[1] - p) - Math.max(0, v[0] - p)) - prem;
            case 'butterfly': return (Math.max(0, p - v[0]) - 2 * Math.max(0, p - v[1]) + Math.max(0, p - v[2])) - prem;
            case 'iron_condor': 
                // 鐵鷹 (Credit): 賣出中間(v1, v2), 買入外側(v0, v3)
                // 虧損發生在跌破 v1 或漲破 v2 時，直到觸及保護腳 v0 或 v3
                const lossPut = Math.max(0, v[1] - p) - Math.max(0, v[0] - p);
                const lossCall = Math.max(0, p - v[2]) - Math.max(0, p - v[3]);
                return prem - (lossPut + lossCall);
            default: return 0;
        }
    }

    function runCalculation() {
        if(!validateLogic()) return;
        isCalculated = true; hideTooltip();
        const s = document.getElementById('strategySelect').value;
        const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value) || 0);
        const prem = parseFloat(document.getElementById('premium').value) || 0, S = parseFloat(document.getElementById('target').value) || 0, d = i18n[currentLang];
        let mP = 0, mL = 0, h = d.hints.neut;
        if(s.includes('call') && s!=='iron_condor') h = d.hints.bull; else if(s.includes('put') && s!=='iron_condor') h = d.hints.bear;

        switch(s) {
            case 'long_call': case 'long_put': mP = d.unlimited; mL = prem * 100; break;
            case 'short_call': case 'short_put': mP = prem * 100; mL = d.unlimited; break;
            case 'bull_call': case 'bear_put': mP = (Math.abs(v[1]-v[0])-prem)*100; mL = prem*100; break;
            case 'butterfly': mP = (v[1]-v[0]-prem)*100; mL = prem*100; break;
            case 'iron_condor': mP = prem * 100; mL = (Math.max(v[1]-v[0], v[3]-v[2]) - prem) * 100; break;
        }
        document.getElementById('res-max-profit').innerText = (typeof mP === 'number') ? `$${mP.toFixed(0)}` : mP;
        document.getElementById('res-max-loss').innerText = (typeof mL === 'number') ? `$${mL.toFixed(0)}` : mL;
        document.getElementById('res-prob').innerText = h;
        document.getElementById('ui-probHint').innerText = d.opt[s];

        let center = (v[0]+(v[3]||v[2]||v[1]||v[0]))/2;
        const range = Math.max(Math.abs(center-v[0]), Math.abs(center-S), 50) * 1.8;
        const xMin = Math.max(0, center - range), xMax = center + range;
        let data = [], beps = [];
        for(let i=0; i<=250; i++) {
            let p = xMin + (i * (xMax - xMin) / 250);
            let y = getP(p, s, v, prem); data.push({x: p, y: y});
            if (i > 0 && ((data[i-1].y < 0 && y >= 0) || (data[i-1].y > 0 && y <= 0))) beps.push({x: p});
        }
        drawSVG(data, xMin, xMax, S, beps);
    }

    function drawSVG(data, xMin, xMax, spot, beps) {
        const svg = document.getElementById('mainChart'), W = 800, H = 400, MID = H/2, d = i18n[currentLang];
        const allY = data.map(p => Math.abs(p.y)), maxY = Math.max(...allY, 1) * 1.2;
        const getX = (x) => ((x - xMin) / (xMax - xMin)) * W, getY = (y) => MID - (y / maxY) * (MID * 0.8);
        const pathD = `M ${getX(data[0].x)} ${getY(data[0].y)} ` + data.slice(1).map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
        const fillD = `${pathD} L ${getX(data[data.length-1].x)} ${MID} L ${getX(data[0].x)} ${MID} Z`;
        svg.innerHTML = `
            <defs><clipPath id="u"><rect x="0" y="0" width="800" height="${MID}"/></clipPath><clipPath id="dn"><rect x="0" y="${MID}" width="800" height="${MID}"/></clipPath></defs>
            <path d="${fillD}" fill="var(--success)" opacity="0.15" clip-path="url(#u)"/><path d="${fillD}" fill="var(--danger)" opacity="0.15" clip-path="url(#dn)"/>
            <line x1="0" y1="${MID}" x2="800" y2="${MID}" stroke="#475569" stroke-width="1.5"/><path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="3"/>
            <g><line x1="${getX(spot)}" y1="0" x2="${getX(spot)}" y2="${H}" stroke="white" stroke-dasharray="5" opacity="0.3"/><text x="${getX(spot)}" y="15" fill="white" font-size="10" text-anchor="middle" font-weight="900">SPOT</text></g>
            ${beps.map((b, i) => `<g><circle cx="${getX(b.x)}" cy="${MID}" r="5" fill="#fbbf24"/><text x="${getX(b.x)}" y="${MID + (i % 2 === 0 ? 25 : -15)}" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">${d.bep} ${b.x.toFixed(1)}</text></g>`).join('')}
        `;
        svg.onmousemove = (e) => {
            if(!isCalculated) return;
            const rect = svg.getBoundingClientRect(), mx = (e.clientX - rect.left) * (W / rect.width), tt = document.getElementById('chart-tooltip');
            const item = data.reduce((a, b) => Math.abs(getX(b.x)-mx) < Math.abs(getX(a.x)-mx) ? b : a);
            tt.style.display = 'block'; 
            let tx = e.clientX - rect.left + 20; if (tx + 180 > rect.width) tx = e.clientX - rect.left - 190;
            tt.style.left = tx + 'px'; tt.style.top = (e.clientY - rect.top - 70) + 'px';
            tt.innerHTML = `<div style="color:var(--secondary); font-size:10px;">${d.price}</div><b style="font-size:15px;">$${item.x.toFixed(2)}</b><hr style="border:0; border-top:1px solid #334155; margin:8px 0;"><div style="color:var(--secondary); font-size:10px;">${d.pl}</div><b style="color:${item.y>=0?'var(--success)':'var(--danger)'}; font-size:15px;">$${(item.y*100).toFixed(0)}</b>`;
        };
        svg.onmouseleave = hideTooltip;
    }

    function setLanguage(lang) {
        currentLang = lang; const d = i18n[lang];
        document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
        document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
        ['title','strategy','s1','s2','s3','s4','premium','target','maxReward','maxRisk','probHint'].forEach(id => {
            if(document.getElementById('ui-'+id)) document.getElementById('ui-'+id).innerText = d[id];
        });
        document.getElementById('calcBtn').innerText = d.calc;
        document.getElementById('seo-article').innerHTML = d.seo;
        const select = document.getElementById('strategySelect');
        const cur = select.value || 'long_call';
        select.innerHTML = Object.entries(d.opt).map(([k,v]) => `<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join('');
        updateTags(); validateLogic();
        if(isCalculated) runCalculation();
    }
    window.onload = () => { setLanguage('en'); updateFields(); };
</script>
</body>
</html>
