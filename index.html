<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Options P/L Calculator - Fast & Clear</title>
    <meta name="description" content="Instantly calculate options profit or loss. Simple interface for traders to simulate Call and Put scenarios.">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --primary: #2563eb;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 13px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        
        /* 廣告位樣式 */
        .ad-slot { background: #f1f5f9; border-radius: 8px; margin: 20px 0; text-align: center; min-height: 100px; padding: 10px; border: 1px dashed #cbd5e1; color: #94a3b8; font-size: 12px; }
        
        /* 圖表樣式 */
        #chart-container { margin-top: 20px; display: none; }
        svg { background: #f1f5f9; border-radius: 8px; width: 100%; height: 180px; }
        
        #result { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 17px; display: none; }
        .pos { background-color: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .neg { background-color: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Options P/L Tool</h2>

        <div class="ad-slot">AdSense Banner</div>
        
        <div class="row">
            <div class="input-group">
                <label>Type</label>
                <select id="type">
                    <option value="call">Call</option>
                    <option value="put">Put</option>
                </select>
            </div>
            <div class="input-group">
                <label>Strike Price ($)</label>
                <input type="number" id="strike" placeholder="100">
            </div>
        </div>
        <div class="row">
            <div class="input-group">
                <label>Premium Paid ($)</label>
                <input type="number" id="premium" placeholder="5">
            </div>
            <div class="input-group">
                <label>Target Price ($)</label>
                <input type="number" id="target" placeholder="110">
            </div>
        </div>

        <button onclick="calculate()">Calculate & Graph</button>

        <div id="chart-container">
            <svg viewBox="0 0 400 200" id="pl-chart">
                </svg>
        </div>

        <div id="result"></div>

        <div class="ad-slot" style="min-height: 250px;">AdSense Square</div>

    </div>

    <script>
        function calculate() {
            const type = document.getElementById('type').value;
            const strike = parseFloat(document.getElementById('strike').value);
            const premium = parseFloat(document.getElementById('premium').value);
            const target = parseFloat(document.getElementById('target').value);
            const resultDiv = document.getElementById('result');
            const chartContainer = document.getElementById('chart-container');

            if (isNaN(strike) || isNaN(premium) || isNaN(target)) {
                resultDiv.style.display = 'block';
                resultDiv.innerText = "Please fill all fields";
                resultDiv.className = '';
                chartContainer.style.display = 'none';
                return;
            }

            let pl = 0;
            if (type === 'call') {
                pl = Math.max(0, target - strike) - premium;
            } else {
                pl = Math.max(0, strike - target) - premium;
            }

            const totalPL = pl * 100;
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `P/L: $${totalPL.toFixed(2)}`;
            resultDiv.className = totalPL >= 0 ? 'pos' : 'neg';

            // 繪製圖表
            chartContainer.style.display = 'block';
            drawChart(type, strike, premium, target);
        }

function drawChart(type, strike, premium, target) {
    const svg = document.getElementById('pl-chart');
    const width = 400;
    const height = 200;
    const midY = height / 2;
    
    // 1. 定義圖表的價格範圍（自動根據 Strike 縮放）
    const priceRange = strike * 0.4; // 顯示 Strike 上下 40% 的範圍
    const minPrice = strike - priceRange;
    const maxPrice = strike + priceRange;
    
    // 2. 將價格轉換為 SVG X 坐標的函數
    const getX = (price) => {
        return ((price - minPrice) / (maxPrice - minPrice)) * width;
    };
    
    // 3. 將盈虧金額轉換為 SVG Y 坐標的函數 (需要定義盈虧範圍)
    const maxPL = premium * 100 * 3; // 假設最大顯示盈虧為權利金的 3 倍
    const getY = (pl) => {
        return midY - (pl / maxPL) * (height / 2);
    };

    // 4. 計算關鍵點 (盈虧平衡點)
    const breakEvenPrice = type === 'call' ? strike + premium : strike - premium;
    
    // 5. 繪製圖表
    let pathData = "";
    if (type === 'call') {
        // Call: 左邊水平低，到Strike點上升
        pathData = `M 0 ${getY(-premium * 100)} L ${getX(strike)} ${getY(-premium * 100)} L ${getX(maxPrice)} ${getY((maxPrice - strike - premium) * 100)}`;
    } else {
        // Put: 左邊高，到Strike點下降，右邊水平
        pathData = `M 0 ${getY((strike - minPrice - premium) * 100)} L ${getX(strike)} ${getY(-premium * 100)} L ${getX(maxPrice)} ${getY(-premium * 100)}`;
    }

    svg.innerHTML = `
        <line x1="0" y1="${midY}" x2="${width}" y2="${midY}" stroke="#94a3b8" stroke-width="1" />
        
        <path d="${pathData}" fill="none" stroke="${totalPL >= 0 ? '#16a34a' : '#dc2626'}" stroke-width="3" />
        
        <line x1="${getX(strike)}" y1="0" x2="${getX(strike)}" y2="${height}" stroke="#cbd5e1" stroke-dasharray="4,4" />
        <text x="${getX(strike)}" y="15" text-anchor="middle" font-size="10" fill="#64748b">Strike: $${strike}</text>
    `;
}
    </script>
</body>

</html>
