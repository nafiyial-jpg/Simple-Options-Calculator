<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Pro Options Lab | Free Options Profit Calculator</title>
    
    <!-- SEO Meta & Schema -->
    <meta name="description" content="Professional options profit calculator. Visualizing Iron Condor, Butterfly, and Vertical spreads with interactive P/L graphs.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Pro Options Lab",
      "operatingSystem": "Web",
      "applicationCategory": "FinanceApplication",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

<style>
    :root { 
        --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --secondary: #94a3b8; 
        --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --input-bg: #334155;
        --buy: #38bdf8; --sell: #fb7185; --share-bg: #6366f1; 
    }
    * { box-sizing: border-box; }
    
    /* 修正：統一字體族，避免中英切換跳動 */
    body { 
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        background: var(--bg); color: var(--text); padding: 15px; margin: 0; 
        display: flex; flex-direction: column; align-items: center; 
        -webkit-font-smoothing: antialiased;
    }

    .container { background: var(--card); padding: 25px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); width: 100%; max-width: 1200px; border: 1px solid rgba(255,255,255,0.1); }
    
    .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 992px) {
        .dashboard { grid-template-columns: 340px 1fr; align-items: start; }
        .sticky-side { position: sticky; top: 15px; }
    }

    /* 頂部按鈕對齊 */
    .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 15px; }
    .lang-btn, .share-btn { height: 36px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; gap: 5px; justify-content: center; }
    .lang-btn { background: var(--input-bg); color: var(--secondary); min-width: 60px; }
    .lang-btn.active { background: var(--primary) !important; color: #000 !important; }
    .share-btn { background: var(--share-bg); color: white; }

    h1 { font-size: 1.5rem; margin: 0 0 15px 0; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
    .ad-slim { min-height: 90px; background: rgba(0,0,0,0.2); border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--secondary); border: 1px dashed rgba(255,255,255,0.1); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: flex-end; }
    .full-width { grid-column: 1 / -1; }
    
    label { display: flex; align-items: center; font-size: 11px; font-weight: 800; min-height: 22px; margin-bottom: 6px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .op-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: auto; white-space: nowrap; }

    input, select { width: 100%; height: 44px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 15px; background: var(--input-bg); color: white; outline: none; }
    button#calcBtn { width: 100%; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 20px; transition: 0.2s; text-transform: uppercase; }

    /* 修正：卡片字體與對齊優化 */
    #summary-panel { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .data-card { 
        background: rgba(255,255,255,0.03); 
        padding: 15px; 
        border-radius: 16px; 
        border: 1px solid rgba(255,255,255,0.06); 
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 85px; /* 固定最小高度，避免語言切換時跳動 */
    }
    .data-card.full { grid-column: 1 / -1; min-height: 70px; }
    .data-label { display: block; font-size: 11px; font-weight: 800; color: var(--secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .data-val { 
        font-size: 24px; 
        font-weight: 900; 
        font-variant-numeric: tabular-nums; /* 修正：讓數字寬度固定，避免切換時抖動 */
        line-height: 1.2;
    }

    #chart-wrapper { position: relative; background: #000; border-radius: 20px; height: 420px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 20px; }
    .tooltip { position: absolute; background: rgba(15, 23, 42, 0.96); padding: 12px; border-radius: 10px; font-size: 13px; color: white; pointer-events: none; border: 1px solid var(--primary); z-index: 1000; display: none; white-space: nowrap; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    
    /* SEO 內容樣式 */
    .seo-content { margin-top: 40px; color: var(--secondary); line-height: 1.7; font-size: 0.95rem; text-align: left; max-width: 900px; }
    .seo-content h2 { color: var(--text); border-bottom: 1px solid #334155; padding-bottom: 10px; font-weight: 800; }
    .seo-content h4 { margin: 25px 0 10px 0; font-size: 1.1rem; }
    .seo-content h4 strong { color: var(--primary); font-weight: 800; } 
    .seo-content strong { color: var(--text); font-weight: 700; } 
</style>
    
</head>
<body>
<main class="container">
    <div class="top-bar">
        <button id="shareBtn" class="share-btn" onclick="copyShareLink()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <span id="ui-share">Copy Link</span>
        </button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button id="btn-zh" class="lang-btn" onclick="setLanguage('zh')">繁中</button>
    </div>

    <div class="ad-slim">ADVERTISEMENT - RESPONSIVE BANNER</div>

    <div class="dashboard">
        <div class="sticky-side">
            <h1 id="ui-title">Pro Options Lab</h1>
            <div class="grid">
                <div class="full-width field-group">
                    <label id="ui-strategy">Strategy</label>
                    <select id="strategySelect" onchange="handleStrategyChange()"></select>
                </div>
                <div class="field-group">
                    <label><span id="ui-s1">Strike 1</span><span id="tag-s1" class="op-tag"></span></label>
                    <input type="number" id="s1" value="95" oninput="handleInputChange()">
                </div>
                <div id="boxS2" class="field-group">
                    <label><span id="ui-s2">Strike 2</span><span id="tag-s2" class="op-tag"></span></label>
                    <input type="number" id="s2" value="100" oninput="handleInputChange()">
                </div>
                <div id="boxS3" class="field-group">
                    <label><span id="ui-s3">Strike 3</span><span id="tag-s3" class="op-tag"></span></label>
                    <input type="number" id="s3" value="110" oninput="handleInputChange()">
                </div>
                <div id="boxS4" class="field-group">
                    <label><span id="ui-s4">Strike 4</span><span id="tag-s4" class="op-tag"></span></label>
                    <input type="number" id="s4" value="115" oninput="handleInputChange()">
                </div>
                <div class="field-group">
                    <label id="ui-premium">Net Prem ($)</label>
                    <input type="number" id="premium" step="0.1" value="2.0" oninput="handleInputChange()">
                </div>
                <div class="field-group">
                    <label id="ui-target">Spot Price ($)</label>
                    <input type="number" id="target" value="105" oninput="handleInputChange()">
                </div>
            </div>
            <button id="calcBtn" onclick="runCalculation()">ANALYZE</button>

            <div id="summary-panel">
                <div class="data-card"><span class="data-label" id="ui-maxReward">Max Profit</span><span id="res-max-profit" class="data-val" style="color:var(--success)">--</span></div>
                <div class="data-card"><span class="data-label" id="ui-maxRisk">Max Risk</span><span id="res-max-loss" class="data-val" style="color:var(--danger)">--</span></div>
                <div class="data-card full"><span class="data-label" id="ui-probHint">Logic Hint</span><span id="res-prob" class="data-val" style="color:var(--primary); font-size:12px;">--</span></div>
            </div>
        </div>

        <div class="visual-side">
            <div id="chart-wrapper">
                <div id="chart-tooltip" class="tooltip"></div>
                <svg id="mainChart" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <div class="ad-slim" style="min-height: 250px;">ADVERTISEMENT - RECTANGLE AD</div>
        </div>
    </div>

    <article id="seo-article" class="seo-content"></article>
    <div class="disclaimer">Disclaimer: Options trading involves risk. Educational purposes only.</div>
</main>

<script>
const i18n = {
    en: {
        title: "Pro Options Lab", strategy: "Strategy", s1: "Strike 1", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4", premium: "Net Prem ($)", target: "Spot ($)", maxReward: "Max Profit", maxRisk: "Max Risk", probHint: "Logic Hint", calc: "ANALYZE STRATEGY", price: "PRICE", pl: "EST. P/L", bep: "BEP", buy: "BUY", sell: "SELL", low: "Low", mid: "Mid", high: "High", call: "CALL", put: "PUT", unlimited: "Unlimited", share: "Copy Link", copied: "Copied!",
        opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" },
        hints: { ready: "Ready to Analyze", err: "Logic Error!", bull: "Bullish", bear: "Bearish", neut: "Neutral" },
        seo: `<h2>Mastering Options Trading with Visual P/L Analysis</h2>
              <p>Using an <strong>Options Profit Calculator</strong> is the most effective way to manage risk. Pro Options Lab simplifies complex derivatives into interactive graphs.</p>
              <h3>Popular Strategies Explained</h3>
              <h4>1. <strong>Iron Condor</strong></h4>
              <p>The <strong>Iron Condor</strong> is a neutral strategy designed to profit from low volatility. It involves selling a bear call spread and a bull put spread simultaneously.</p>
              <h4>2. <strong>Butterfly Spread</strong></h4>
              <p>A <strong>Butterfly Spread</strong> is a limited-risk strategy. Peak profit occurs when the stock price equals the middle strike at expiry.</p>
              <h4>3. <strong>Vertical Spreads (Bull/Bear)</strong></h4>
              <p>Define your absolute Maximum Risk and Reward by visualizing the offset between premiums. These spreads limit your downside while defining clear profit targets.</p>`
    },
    zh: {
        title: "專業期權實驗室", strategy: "交易策略", s1: "履約價 1", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4", premium: "權利金淨額", target: "標的價格", maxReward: "最大獲利", maxRisk: "最大風險", probHint: "邏輯提示", calc: "損益分析", price: "標的價格", pl: "預計損益", bep: "損益點", buy: "買入", sell: "賣出", low: "低", mid: "中", high: "高", call: "買權", put: "賣權", unlimited: "無限制", share: "複製連結", copied: "已複製！",
        opt: { long_call: "買入買權", short_call: "賣出買權", long_put: "買入賣權", short_put: "賣出賣權", bull_call: "牛市買權價差", bear_put: "熊市賣權價差", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" },
        hints: { ready: "設定正確", err: "順序錯誤！", bull: "看多策略", bear: "看空策略", neut: "中性策略" },
        seo: `<h2>透過視覺化損益圖表掌握期權交易</h2>
              <p><strong>期權損益計算機</strong>是管理風險最有效的方式。Pro Options Lab 將衍生性商品轉化為損益圖表，幫助您預測各種市場情境。</p>
              <h3>熱門策略解析</h3>
              <h4>1. <strong>鐵鷹策略 (Iron Condor)</strong></h4>
              <p>旨在從低波動中獲利的中性策略。透過同時賣出一個熊市看漲價差與一個牛市看跌價差，目標是讓股價維持在區間內。</p>
              <h4>2. <strong>蝴蝶價差 (Butterfly Spread)</strong></h4>
              <p>風險有限的中性策略。當標的資產在到期時的價格等於中間履約價時，該策略將達到最大獲利值。</p>
              <h4>3. <strong>垂直價差 (Vertical Spreads - 牛市/熊市價差)</strong></h4>
              <p>透過視覺化買入與賣出期權之間的權利金差額，鎖定明確的獲利與風險目標。<strong>垂直價差</strong>能在限制下檔風險的同時，定義清晰的獲利目標。</p>`
    }
};

let currentLang = 'en', isCalculated = false, globalData = [];

function setLanguage(lang) {
    currentLang = lang; const d = i18n[lang];
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === 'btn-'+lang));
    ['strategy','s1','s2','s3','s4','premium','target','maxReward','maxRisk','probHint'].forEach(id => {
        const el = document.getElementById('ui-'+id); if(el) el.innerText = d[id];
    });
    document.getElementById('calcBtn').innerText = d.calc;
    document.getElementById('seo-article').innerHTML = d.seo;
    document.getElementById('ui-title').innerText = d.title;
    document.getElementById('ui-share').innerText = d.share;
    const select = document.getElementById('strategySelect');
    const curVal = select.value || 'long_call';
    select.innerHTML = Object.entries(d.opt).map(([k,v]) => `<option value="${k}" ${k===curVal?'selected':''}>${v}</option>`).join('');
    updateTags(); validateLogic(); if(isCalculated) runCalculation();
}

function resetResults() {
    isCalculated = false;
    document.getElementById('res-max-profit').innerText = "--";
    document.getElementById('res-max-loss').innerText = "--";
    document.getElementById('mainChart').innerHTML = "";
}

function handleStrategyChange() { resetResults(); updateFields(); updateTags(); validateLogic(); }
function handleInputChange() { resetResults(); validateLogic(); }

function updateFields() {
    const s = document.getElementById('strategySelect').value;
    ['boxS2','boxS3','boxS4'].forEach(id => document.getElementById(id).style.display = 'none');
    if(!['long_call','short_call','long_put','short_put'].includes(s)) document.getElementById('boxS2').style.display = 'flex';
    if(['butterfly','iron_condor'].includes(s)) document.getElementById('boxS3').style.display = 'flex';
    if(s==='iron_condor') document.getElementById('boxS4').style.display = 'flex';
}

function updateTags() {
    const s = document.getElementById('strategySelect').value, d = i18n[currentLang];
    const setTag = (id, act, typ, pos) => {
        const el = document.getElementById('tag-'+id); if(!el) return;
        el.innerText = `${d[act]} ${d[typ]} (${d[pos]})`;
        el.className = `op-tag tag-${act}`;
    };
    switch(s) {
        case 'long_call': setTag('s1','buy','call','low'); break;
        case 'short_call': setTag('s1','sell','call','low'); break;
        case 'long_put': setTag('s1','buy','put','low'); break;
        case 'short_put': setTag('s1','sell','put','low'); break;
        case 'bull_call': setTag('s1','buy','call','low'); setTag('s2','sell','call','high'); break;
        case 'bear_put': setTag('s1','sell','put','low'); setTag('s2','buy','put','high'); break;
        case 'butterfly': setTag('s1','buy','call','low'); setTag('s2','sell','call','mid'); setTag('s3','buy','call','high'); break;
        case 'iron_condor': setTag('s1','buy','put','low'); setTag('s2','sell','put','mid'); setTag('s3','sell','call','mid'); setTag('s4','buy','call','high'); break;
    }
}

function validateLogic() {
    const s = document.getElementById('strategySelect').value;
    const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value)||0);
    const btn = document.getElementById('calcBtn'), hint = document.getElementById('res-prob'), d = i18n[currentLang];
    let valid = true;
    if(['bull_call','bear_put'].includes(s) && v[0]>=v[1]) valid = false;
    else if(s==='butterfly' && (v[0]>=v[1] || v[1]>=v[2])) valid = false;
    else if(s==='iron_condor' && (v[0]>=v[1] || v[1]>=v[2] || v[2]>=v[3])) valid = false;
    btn.disabled = !valid;
    hint.innerText = valid ? (isCalculated ? hint.innerText : d.hints.ready) : d.hints.err;
    hint.style.color = valid ? 'var(--primary)' : 'var(--danger)';
    return valid;
}

function getP(p, s, v, prem) {
    switch(s) {
        case 'long_call': return Math.max(0, p-v[0])-prem;
        case 'short_call': return prem-Math.max(0, p-v[0]);
        case 'long_put': return Math.max(0, v[0]-p)-prem;
        case 'short_put': return prem-Math.max(0, v[0]-p);
        case 'bull_call': return (Math.max(0, p-v[0])-Math.max(0, p-v[1]))-prem;
        case 'bear_put': return (Math.max(0, v[1]-p)-Math.max(0, v[0]-p))-prem;
        case 'butterfly': return (Math.max(0, p-v[0])-2*Math.max(0, p-v[1])+Math.max(0, p-v[2]))-prem;
        case 'iron_condor': return prem - (Math.max(0, v[1]-p)-Math.max(0, v[0]-p) + Math.max(0, p-v[2])-Math.max(0, p-v[3]));
        default: return 0;
    }
}

function runCalculation() {
    if(!validateLogic()) return; isCalculated = true;
    const s = document.getElementById('strategySelect').value;
    const v = [1,2,3,4].map(i => parseFloat(document.getElementById('s'+i).value)||0);
    const prem = parseFloat(document.getElementById('premium').value)||0;
    const S = parseFloat(document.getElementById('target').value)||0;
    const d = i18n[currentLang];
    
    let mP = 0, mL = 0, h = d.hints.neut;
    if(['long_call','bull_call'].includes(s)) h = d.hints.bull; else if(['long_put','bear_put'].includes(s)) h = d.hints.bear;

    switch(s) {
        case 'long_call': case 'long_put': mP = d.unlimited; mL = prem*100; break;
        case 'short_call': case 'short_put': mP = prem*100; mL = d.unlimited; break;
        case 'bull_call': case 'bear_put': mP = (Math.abs(v[1]-v[0])-prem)*100; mL = prem*100; break;
        case 'butterfly': mP = (v[1]-v[0]-prem)*100; mL = prem*100; break;
        case 'iron_condor': mP = prem*100; mL = (Math.max(v[1]-v[0], v[3]-v[2])-prem)*100; break;
    }
    document.getElementById('res-max-profit').innerText = (typeof mP === 'number') ? `$${mP.toFixed(0)}` : mP;
    document.getElementById('res-max-loss').innerText = (typeof mL === 'number') ? `$${mL.toFixed(0)}` : mL;
    document.getElementById('res-prob').innerText = h;

    let range = Math.max(Math.abs(S-v[0]), 50) * 1.6, xMin = Math.max(0, S-range), xMax = S+range;
    globalData = []; let beps = [];
    for(let i=0; i<=200; i++) {
        let p = xMin + (i * (xMax-xMin)/200), y = getP(p, s, v, prem);
        globalData.push({x: p, y: y});
        if (i > 0 && ((globalData[i-1].y < 0 && y >= 0) || (globalData[i-1].y > 0 && y <= 0))) beps.push({x: p});
    }
    drawSVG(globalData, xMin, xMax, S, beps);
}

function drawSVG(data, xMin, xMax, spot, beps) {
    const svg = document.getElementById('mainChart'), W = 800, H = 400, MID = H/2, d = i18n[currentLang];
    const maxY = Math.max(...data.map(p => Math.abs(p.y)), 1) * 1.2;
    const getX = (x) => ((x-xMin)/(xMax-xMin))*W, getY = (y) => MID-(y/maxY)*(MID*0.8);
    const pathD = `M ${getX(data[0].x)} ${getY(data[0].y)} ` + data.slice(1).map(p => `L ${getX(p.x)} ${getY(p.y)}`).join(' ');
    const fillD = `${pathD} L ${getX(data[data.length-1].x)} ${MID} L ${getX(data[0].x)} ${MID} Z`;
    
    svg.innerHTML = `<defs><clipPath id="u"><rect x="0" y="0" width="800" height="${MID}"/></clipPath><clipPath id="dn"><rect x="0" y="${MID}" width="800" height="${MID}"/></clipPath></defs>
        <path d="${fillD}" fill="var(--success)" opacity="0.15" clip-path="url(#u)"/><path d="${fillD}" fill="var(--danger)" opacity="0.15" clip-path="url(#dn)"/>
        <line x1="0" y1="${MID}" x2="800" y2="${MID}" stroke="#475569" stroke-width="1"/><path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="3"/>
        <line x1="${getX(spot)}" y1="0" x2="${getX(spot)}" y2="${H}" stroke="white" stroke-dasharray="5" opacity="0.4"/>
        ${beps.map(b => `<circle cx="${getX(b.x)}" cy="${MID}" r="5" fill="#fbbf24"/><text x="${getX(b.x)}" y="${MID-12}" fill="#fbbf24" font-size="10" text-anchor="middle" font-weight="700">${d.bep} ${b.x.toFixed(1)}</text>`).join('')}`;

    svg.onmousemove = (e) => {
        if(!isCalculated) return;
        const rect = svg.getBoundingClientRect(), tt = document.getElementById('chart-tooltip');
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const item = globalData.reduce((a, b) => Math.abs(getX(b.x) - mx) < Math.abs(getX(a.x) - mx) ? b : a);
        tt.style.display = 'block';
        let posX = e.clientX - rect.left + 20, ttW = 160;
        if (posX + ttW > rect.width) posX = e.clientX - rect.left - ttW - 20;
        tt.style.left = posX + 'px'; tt.style.top = (e.clientY - rect.top - 65) + 'px';
        tt.innerHTML = `${d.price}: $${item.x.toFixed(2)}<br>${d.pl}: <span style="color:${item.y>=0?'var(--success)':'var(--danger)'}; font-weight:900">$${(item.y*100).toFixed(0)}</span>`;
    };
    svg.onmouseleave = () => document.getElementById('chart-tooltip').style.display='none';
}

function copyShareLink() { 
    const p = new URLSearchParams(); p.set('lang', currentLang); p.set('s', document.getElementById('strategySelect').value);
    [1,2,3,4].forEach(i => {
        const val = document.getElementById('s'+i).value;
        if(val) p.set('s'+i, val);
    });
    ['premium','target'].forEach(id => p.set(id, document.getElementById(id).value));
    navigator.clipboard.writeText(window.location.origin + window.location.pathname + '?' + p.toString());
    const btn = document.querySelector('#shareBtn span'); btn.innerText = i18n[currentLang].copied; setTimeout(()=>btn.innerText=i18n[currentLang].share, 2000);
}

window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if(params.has('lang')) currentLang = params.get('lang');
    setLanguage(currentLang);
    if(params.has('s')) {
        document.getElementById('strategySelect').value = params.get('s');
        [1,2,3,4].forEach(i => { if(params.has('s'+i)) document.getElementById('s'+i).value = params.get('s'+i); });
        ['premium','target'].forEach(id => { if(params.has(id)) document.getElementById(id).value = params.get(id); });
        updateFields(); updateTags(); runCalculation();
    } else { updateFields(); updateTags(); }
};
</script>
