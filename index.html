<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Profit Calculator | 2026 Visual Strategy Lab</title>
    <meta name="description" content="Instant options risk/reward analysis. Calculate Max Risk, Max Profit, and Probabilities for Iron Condors, Spreads, and more.">
    
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; --secondary: #64748b; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; --text: #0f172a; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; max-width: 520px; }
        
        /* 語系切換 */
        .lang-switch { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px; }
        .lang-btn { background: #f1f5f9; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--secondary); }
        .lang-btn.active { background: var(--primary); color: white; }

        /* 廣告位 */
        .ad-slot { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; margin: 15px 0; text-align: center; color: #94a3b8; font-size: 11px; display: flex; align-items: center; justify-content: center; min-height: 90px; }

        h1 { text-align: center; margin: 0; font-size: 24px; color: var(--primary); letter-spacing: -0.5px; }
        .subtitle { text-align: center; font-size: 14px; color: var(--secondary); margin-bottom: 20px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 4px; color: var(--secondary); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        
        button#calcBtn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }

        /* 2026 風險標籤面板 */
        #risk-panel { margin-top: 20px; padding: 18px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; display: none; }
        .risk-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .risk-item:last-child { border: none; }
        .risk-label { font-weight: 600; color: var(--secondary); }
        .val-p { color: var(--success); font-weight: 800; }
        .val-l { color: var(--danger); font-weight: 800; }
        .val-prob { background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }

        #result-display { margin-top: 15px; padding: 15px; border-radius: 10px; text-align: center; font-weight: 800; font-size: 22px; display: none; }
        .pos { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
        .neg { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

        #chart-wrapper { position: relative; margin-top: 20px; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; height: 260px; }
        svg { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">中文</button>
    </div>

    <h1 id="ui-title">Options Profit Calculator</h1>
    <p class="subtitle" id="ui-subtitle">Visual Risk & Reward Analyzer</p>

    <div class="ad-slot">Google AdSense - Header Ad</div>

    <div style="margin-bottom:15px">
        <label id="ui-strategy-label">Strategy</label>
        <select id="strategySelect" onchange="updateFields()"></select>
    </div>

    <div class="grid">
        <div><label id="ui-s1">Strike 1 (Low)</label><input type="number" id="s1" value="100"></div>
        <div id="boxS2" style="display:none;"><label id="ui-s2">Strike 2</label><input type="number" id="s2" value="110"></div>
        <div id="boxS3" style="display:none;"><label id="ui-s3">Strike 3</label><input type="number" id="s3" value="120"></div>
        <div id="boxS4" style="display:none;"><label id="ui-s4">Strike 4 (High)</label><input type="number" id="s4" value="130"></div>
        <div><label id="ui-premium">Total Premium ($)</label><input type="number" id="premium" value="5"></div>
        <div><label id="ui-target">Target Price ($)</label><input type="number" id="target" value="115"></div>
    </div>

    <button id="calcBtn" onclick="runCalculation()">Get Risk Analysis</button>

    <!-- 新增：2026 一鍵得知風險面板 -->
    <div id="risk-panel">
        <div class="risk-item">
            <span class="risk-label" id="ui-max-profit">Max Reward</span>
            <span id="res-max-profit" class="val-p">--</span>
        </div>
        <div class="risk-item">
            <span class="risk-label" id="ui-max-loss">Max Risk</span>
            <span id="res-max-loss" class="val-l">--</span>
        </div>
        <div class="risk-item">
            <span class="risk-label" id="ui-prob-label">Win Probability Hint</span>
            <span id="res-prob" class="val-prob">--</span>
        </div>
    </div>

    <div id="result-display"></div>

    <div id="chart-wrapper">
        <svg id="mainChart" viewBox="0 0 400 240"></svg>
    </div>

    <div class="ad-slot" style="min-height:120px">Google AdSense - Footer Ad</div>
</div>

<script>
const i18n = {
    en: {
        title: "Options Profit Calculator", subtitle: "Visual Risk & Reward Analyzer",
        strategy: "Strategy", calc: "Get Risk Analysis",
        s1: "Strike 1 (Low)", s2: "Strike 2", s3: "Strike 3", s4: "Strike 4 (High)",
        premium: "Total Premium ($)", target: "Target Price ($)", res: "Est. P/L: ",
        profit: "PROFIT", loss: "LOSS", maxProfit: "Max Reward", maxLoss: "Max Risk",
        probLabel: "Probability Hint", unlimited: "Unlimited",
        probHigh: "High Probability / Low Reward", probLow: "Low Probability / High Reward", probNeutral: "Balanced Probability",
        opt: { long_call: "Long Call", short_call: "Short Call", long_put: "Long Put", short_put: "Short Put", bull_call: "Bull Call Spread", bear_put: "Bear Put Spread", straddle: "Straddle", strangle: "Strangle", butterfly: "Butterfly Spread", iron_condor: "Iron Condor" }
    },
    zh: {
        title: "期權損益模擬器", subtitle: "視覺化風險回報分析",
        strategy: "交易策略", calc: "一鍵分析風險",
        s1: "履約價 1 (低)", s2: "履約價 2", s3: "履約價 3", s4: "履約價 4 (高)",
        premium: "淨權利金 ($)", target: "目標價格 ($)", res: "預計損益: ",
        profit: "獲利區", loss: "虧損區", maxProfit: "最大獲利", maxLoss: "最大風險",
        probLabel: "勝率特性提示", unlimited: "理論無限",
        probHigh: "高勝率 / 低回報 (賣方特性)", probLow: "低勝率 / 高回報 (買方特性)", probNeutral: "勝率中性 (波動率策略)",
        opt: { long_call: "買入買權 (Long Call)", short_call: "賣出買權 (Short Call)", long_put: "買入賣權 (Long Put)", short_put: "賣出賣權 (Short Put)", bull_call: "牛市價差", bear_put: "熊市價差", straddle: "跨式組合", strangle: "勒式組合", butterfly: "蝴蝶價差", iron_condor: "鐵鷹策略" }
    }
};

let currentLang = 'en';

function setLanguage(lang) {
    currentLang = lang;
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
    document.getElementById('ui-title').innerText = i18n[lang].title;
    document.getElementById('ui-subtitle').innerText = i18n[lang].subtitle;
    document.getElementById('ui-strategy-label').innerText = i18n[lang].strategy;
    document.getElementById('calcBtn').innerText = i18n[lang].calc;
    document.getElementById('ui-s1').innerText = i18n[lang].s1;
    document.getElementById('ui-s2').innerText = i18n[lang].s2;
    document.getElementById('ui-s3').innerText = i18n[lang].s3;
    document.getElementById('ui-s4').innerText = i18n[lang].s4;
    document.getElementById('ui-premium').innerText = i18n[lang].premium;
    document.getElementById('ui-target').innerText = i18n[lang].target;
    document.getElementById('ui-max-profit').innerText = i18n[lang].maxProfit;
    document.getElementById('ui-max-loss').innerText = i18n[lang].maxLoss;
    document.getElementById('ui-prob-label').innerText = i18n[lang].probLabel;

    const select = document.getElementById('strategySelect');
    const val = select.value || 'long_call';
    select.innerHTML = '';
    for (const [key, text] of Object.entries(i18n[lang].opt)) {
        const opt = new Option(text, key);
        if (key === val) opt.selected = true;
        select.add(opt);
    }
    updateFields();
}

function updateFields() {
    const s = document.getElementById('strategySelect').value;
    document.getElementById('boxS2').style.display = ['bull_call','bear_put','strangle','butterfly','iron_condor'].includes(s) ? 'block' : 'none';
    document.getElementById('boxS3').style.display = ['butterfly','iron_condor'].includes(s) ? 'block' : 'none';
    document.getElementById('boxS4').style.display = (s === 'iron_condor') ? 'block' : 'none';
}

function runCalculation() {
    const strategy = document.getElementById('strategySelect').value;
    const v1 = parseFloat(document.getElementById('s1').value), v2 = parseFloat(document.getElementById('s2').value);
    const v3 = parseFloat(document.getElementById('s3').value), v4 = parseFloat(document.getElementById('s4').value);
    const prem = parseFloat(document.getElementById('premium').value), tgt = parseFloat(document.getElementById('target').value);

    // 損益邏輯
    const getP = (p) => {
        switch(strategy) {
            case 'long_call': return Math.max(0, p - v1) - prem;
            case 'short_call': return prem - Math.max(0, p - v1);
            case 'long_put': return Math.max(0, v1 - p) - prem;
            case 'short_put': return prem - Math.max(0, v1 - p);
            case 'bull_call': return (Math.max(0, p - v1) - Math.max(0, p - v2)) - prem;
            case 'bear_put': return (Math.max(0, v2 - p) - Math.max(0, v1 - p)) - prem;
            case 'straddle': return (Math.max(0, p - v1) + Math.max(0, v1 - p)) - prem;
            case 'strangle': return (Math.max(0, v1 - p) + Math.max(0, p - v2)) - prem;
            case 'butterfly': return (Math.max(0, p - v1) - 2 * Math.max(0, p - v2) + Math.max(0, p - v3)) - prem;
            case 'iron_condor': return prem - (Math.max(0, v1 - p) - Math.max(0, v2 - p) + Math.max(0, p - v4) - Math.max(0, p - v3));
            default: return 0;
        }
    };

    // 2026 一鍵得知風險邏輯
    let mP = 0, mL = 0, prob = "";
    const inf = i18n[currentLang].unlimited;
    const lang = i18n[currentLang];

    switch(strategy) {
        case 'long_call': mP = inf; mL = prem * 100; prob = lang.probLow; break;
        case 'short_call': mP = prem * 100; mL = inf; prob = lang.probHigh; break;
        case 'long_put': mP = (v1 - prem) * 100; mL = prem * 100; prob = lang.probLow; break;
        case 'short_put': mP = prem * 100; mL = (v1 - prem) * 100; prob = lang.probHigh; break;
        case 'bull_call': mP = (v2 - v1 - prem) * 100; mL = prem * 100; prob = lang.probNeutral; break;
        case 'bear_put': mP = (v2 - v1 - prem) * 100; mL = prem * 100; prob = lang.probNeutral; break;
        case 'straddle': mP = inf; mL = prem * 100; prob = lang.probLow; break;
        case 'strangle': mP = inf; mL = prem * 100; prob = lang.probLow; break;
        case 'butterfly': mP = (v2 - v1 - prem) * 100; mL = prem * 100; prob = lang.probLow; break;
        case 'iron_condor': mP = prem * 100; mL = (Math.max(v2-v1, v4-v3) - prem) * 100; prob = lang.probHigh; break;
    }

    document.getElementById('risk-panel').style.display = 'block';
    document.getElementById('res-max-profit').innerText = isNaN(mP) ? mP : `$${mP.toFixed(2)}`;
    document.getElementById('res-max-loss').innerText = isNaN(mL) ? mL : `$${mL.toFixed(2)}`;
    document.getElementById('res-prob').innerText = prob;

    const finalPL = getP(tgt) * 100;
    const resDiv = document.getElementById('result-display');
    resDiv.style.display = 'block';
    resDiv.className = finalPL >= 0 ? 'pos' : 'neg';
    resDiv.innerText = `${lang.res} $${finalPL.toFixed(2)}`;

    // 繪圖
    const xMin = v1 * 0.6, xMax = (v4 || v3 || v2 || v1) * 1.4;
    let pts = [];
    for(let i=0; i<=100; i++) {
        let px = xMin + (i * (xMax - xMin) / 100);
        pts.push({x: px, y: getP(px)});
    }
    drawSVG(pts, xMin, xMax, tgt);
}

function drawSVG(pts, xMin, xMax, tgt) {
    const svg = document.getElementById('mainChart');
    const W = 400, H = 240, MID = H / 2;
    const getX = (x) => ((x - xMin) / (xMax - xMin)) * W;
    const maxY = Math.max(...pts.map(p => Math.abs(p.y))) * 1.5 || 1;
    const getY = (y) => MID - (y / maxY) * (H / 2.8);

    let d = `M ${getX(pts[0].x)} ${getY(pts[0].y)}`;
    pts.forEach(p => d += ` L ${getX(p.x)} ${getY(p.y)}`);

    svg.innerHTML = `
        <rect width="${W}" height="${MID}" fill="rgba(34,197,94,0.05)" />
        <rect y="${MID}" width="${W}" height="${MID}" fill="rgba(239,68,68,0.05)" />
        <line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="#94a3b8" />
        <path d="${d}" fill="none" stroke="var(--primary)" stroke-width="3" />
        <line x1="${getX(tgt)}" y1="0" x2="${getX(tgt)}" y2="${H}" stroke="#000" stroke-dasharray="4" />
        <text x="10" y="20" font-size="10" font-weight="bold" fill="var(--success)">${i18n[currentLang].profit}</text>
        <text x="10" y="${H-10}" font-size="10" font-weight="bold" fill="var(--danger)">${i18n[currentLang].loss}</text>
    `;
}

setLanguage('en');
</script>
</body>
</html>
